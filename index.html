      function addInclinationContributor(name = &#x27;&#x27;, values = {}, id = &#x27;&#x27;) {
        if (root.querySelectorAll(&#x27;[data-inclination-row]&#x27;).length &gt;= 8) return;
        rowCounter += 1;
        const row = document.createElement(&#x27;div&#x27;);
        row.className = &#x27;entry-row inclination-row&#x27;;
        row.dataset.inclinationRow = String(rowCounter);
        row.dataset.inclinationId = id || makeRowId(&#x27;inclination&#x27;);
        const specialBonus = values.specialBonus !== undefined
          ? Number(values.specialBonus) || 0
          : values.special !== undefined ? (Number(values.special) - 1) * 100 || 0 : 0;
        row.innerHTML = `
          &lt;label class=&quot;form-label&quot;&gt;角色名称&lt;input class=&quot;form-control&quot; data-inclination-name type=&quot;text&quot; value=&quot;${escapeHtml(name)}&quot;&gt;&lt;/label&gt;
          &lt;label class=&quot;form-label&quot;&gt;等级&lt;input class=&quot;form-control&quot; data-inclination-level type=&quot;number&quot; min=&quot;1&quot; step=&quot;1&quot; value=&quot;${values.level || 80}&quot;&gt;&lt;/label&gt;
          &lt;label class=&quot;form-label&quot;&gt;角色属性&lt;select class=&quot;form-select&quot; data-inclination-attribute&gt;&lt;option value=&quot;light&quot;&gt;光&lt;/option&gt;&lt;option value=&quot;phase&quot;&gt;相&lt;/option&gt;&lt;option value=&quot;dark&quot;&gt;暗&lt;/option&gt;&lt;option value=&quot;spirit&quot;&gt;灵&lt;/option&gt;&lt;option value=&quot;soul&quot;&gt;魂&lt;/option&gt;&lt;option value=&quot;curse&quot;&gt;咒&lt;/option&gt;&lt;option value=&quot;mind&quot;&gt;心灵&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
          &lt;label class=&quot;form-label&quot;&gt;基础倾陷增伤（%）&lt;input class=&quot;form-control&quot; data-inclination-damage type=&quot;number&quot; step=&quot;0.01&quot; value=&quot;${values.damage || 0}&quot;&gt;&lt;/label&gt;
          &lt;label class=&quot;form-label&quot;&gt;基础防御穿透（%）&lt;input class=&quot;form-control&quot; data-inclination-penetration type=&quot;number&quot; step=&quot;0.01&quot; value=&quot;${values.penetration || 0}&quot;&gt;&lt;/label&gt;
          &lt;label class=&quot;form-label&quot;&gt;基础抗性削弱（%）&lt;input class=&quot;form-control&quot; data-inclination-res-shred type=&quot;number&quot; step=&quot;0.01&quot; value=&quot;${values.resShred || 0}&quot;&gt;&lt;/label&gt;
          &lt;label class=&quot;form-label&quot;&gt;倾陷专属特殊增伤（%）&lt;input class=&quot;form-control&quot; data-inclination-special type=&quot;number&quot; min=&quot;0&quot; step=&quot;0.01&quot; value=&quot;${specialBonus}&quot;&gt;&lt;/label&gt;
          &lt;label class=&quot;form-check&quot;&gt;&lt;input class=&quot;form-check-input&quot; data-inclination-enabled type=&quot;checkbox&quot; ${values.enabled !== false ? &#x27;checked&#x27; : &#x27;&#x27;}&gt;&lt;span class=&quot;form-check-label&quot;&gt;计入合计&lt;/span&gt;&lt;/label&gt;
          &lt;button class=&quot;btn btn-ghost&quot; type=&quot;button&quot; data-remove-inclination&gt;删除角色&lt;/button&gt;`;
        row.querySelector(&#x27;[data-inclination-attribute]&#x27;).value = INCLINATION_PRESET.resistances[values.attribute] !== undefined ? values.attribute : &#x27;light&#x27;;
        byId(&#x27;cdc-inclination-contributors&#x27;).appendChild(row);
        updateAllInclinationScopeSummaries();
      }

      function readInclinationContributors() {
        return Array.from(root.querySelectorAll(&#x27;[data-inclination-row]&#x27;)).map((row, index) =&gt; ({
          id: row.dataset.inclinationId,
          name: row.querySelector(&#x27;[data-inclination-name]&#x27;).value.trim() || `贡献角色${index + 1}`,
          level: Math.max(1, Number(row.querySelector(&#x27;[data-inclination-level]&#x27;).value) || 80),
          attribute: row.querySelector(&#x27;[data-inclination-attribute]&#x27;).value,
          damage: Number(row.querySelector(&#x27;[data-inclination-damage]&#x27;).value) / 100 || 0,
          penetration: Number(row.querySelector(&#x27;[data-inclination-penetration]&#x27;).value) / 100 || 0,
          resShred: Number(row.querySelector(&#x27;[data-inclination-res-shred]&#x27;).value) / 100 || 0,
          specialBonus: Number(row.querySelector(&#x27;[data-inclination-special]&#x27;).value) / 100 || 0,
          enabled: row.querySelector(&#x27;[data-inclination-enabled]&#x27;).checked
        })).map((item) =&gt; ({ ...item, special: 1 + item.specialBonus }));
      }

      function addHeal(name = &#x27;&#x27;, multiplier = 0, observed = 0, enabled = true) {
        rowCounter += 1;
        const row = document.createElement(&#x27;div&#x27;);
        row.className = &#x27;entry-row&#x27;;
        row.dataset.healRow = String(rowCounter);
        row.innerHTML = `
          &lt;label class=&quot;form-label&quot;&gt;治疗技能名称&lt;input class=&quot;form-control&quot; data-heal-name type=&quot;text&quot; value=&quot;${escapeHtml(name)}&quot;&gt;&lt;/label&gt;
          &lt;label class=&quot;form-label&quot;&gt;治疗倍率（%）&lt;input class=&quot;form-control&quot; data-heal-multiplier type=&quot;number&quot; min=&quot;0&quot; step=&quot;0.01&quot; value=&quot;${multiplier}&quot;&gt;&lt;/label&gt;
          &lt;label class=&quot;form-label&quot;&gt;实测显示治疗&lt;input class=&quot;form-control&quot; data-heal-observed type=&quot;number&quot; min=&quot;0&quot; step=&quot;1&quot; value=&quot;${observed}&quot;&gt;&lt;/label&gt;
          &lt;label class=&quot;form-check&quot;&gt;&lt;input class=&quot;form-check-input&quot; data-heal-enabled type=&quot;checkbox&quot; ${enabled ? &#x27;checked&#x27; : &#x27;&#x27;}&gt;&lt;span class=&quot;form-check-label&quot;&gt;纳入验算&lt;/span&gt;&lt;/label&gt;
          &lt;button class=&quot;btn btn-ghost&quot; type=&quot;button&quot; data-remove-heal&gt;删除此治疗技能&lt;/button&gt;
          &lt;div class=&quot;skill-live-preview&quot; data-heal-preview aria-live=&quot;polite&quot;&gt;&lt;span&gt;全部生效预览&lt;/span&gt;&lt;strong&gt;等待输入&lt;/strong&gt;&lt;/div&gt;`;
        byId(&#x27;cdc-heals&#x27;).appendChild(row);
      }

      function readEffects() {
        return Array.from(root.querySelectorAll(&#x27;[data-effect-row]&#x27;)).map((row, index) =&gt; ({
          name: row.querySelector(&#x27;[data-effect-name]&#x27;).value.trim() || `候选效果${index + 1}`,
          searchState: normalizedEffectSearchState(row.querySelector(&#x27;[data-effect-search-state]&#x27;).value),
          priority: row.querySelector(&#x27;[data-effect-priority]&#x27;).checked,
          scopeMode: normalizedScopeMode(row.dataset.scopeMode),
          scopeSkillIds: effectScopeSkillIds(row),
          inclinationScopeMode: row.dataset.inclinationScopeMode === &#x27;custom&#x27; ? &#x27;custom&#x27; : &#x27;all&#x27;,
          inclinationContributorIds: inclinationScopeContributorIds(row),
          stackEnabled: row.querySelector(&#x27;[data-effect-stack-enabled]&#x27;).checked,
          stackMode: row.querySelector(&#x27;[data-effect-stack-mode]&#x27;).value === &#x27;fixed&#x27; ? &#x27;fixed&#x27; : &#x27;auto&#x27;,
          maxStacks: boundedStackValue(row.querySelector(&#x27;[data-effect-max-stacks]&#x27;).value, 6, 1),
          fixedStacks: boundedStackValue(row.querySelector(&#x27;[data-effect-fixed-stacks]&#x27;).value, 0, 0),
          attack: Number(row.querySelector(&#x27;[data-effect-attack]&#x27;).value) / 100 || 0,
          penetration: Number(row.querySelector(&#x27;[data-effect-penetration]&#x27;).value) / 100 || 0,
          resShred: Number(row.querySelector(&#x27;[data-effect-res-shred]&#x27;).value) / 100 || 0,
          damage: Number(row.querySelector(&#x27;[data-effect-damage]&#x27;).value) / 100 || 0,
          dotDamage: Number(row.querySelector(&#x27;[data-effect-dot-damage]&#x27;).value) / 100 || 0,
          inclinationDamage: Number(row.querySelector(&#x27;[data-effect-inclination-damage]&#x27;).value) / 100 || 0,
          crit: Number(row.querySelector(&#x27;[data-effect-crit]&#x27;).value) / 100 || 0,
          skill: Number(row.querySelector(&#x27;[data-effect-skill]&#x27;).value) / 100 || 0,
          skillMultiply: row.querySelector(&#x27;[data-effect-skill-multiply]&#x27;).checked,
          fusionPercent: Number(row.querySelector(&#x27;[data-effect-fusion-percent]&#x27;).value) / 100 || 0,
          fusionFlat: Number(row.querySelector(&#x27;[data-effect-fusion-flat]&#x27;).value) || 0,
          healBonus: Number(row.querySelector(&#x27;[data-effect-heal-bonus]&#x27;).value) / 100 || 0
        }));
      }

      function readSkills() {
        return Array.from(root.querySelectorAll(&#x27;[data-skill-row]&#x27;)).filter(skillRowBelongsToWorkspace).map((row, index) =&gt; ({
          index,
          id: row.dataset.skillId,
          name: row.querySelector(&#x27;[data-skill-name]&#x27;).value.trim() || `伤害技能${index + 1}`,
          model: row.querySelector(&#x27;[data-skill-model]&#x27;).value,
          tag: skillTagForRow(row),
          multiplier: Number(row.querySelector(&#x27;[data-skill-multiplier]&#x27;).value) / 100 || 0,
          observed: Number(row.querySelector(&#x27;[data-skill-observed]&#x27;).value) || 0,
          critical: row.querySelector(&#x27;[data-skill-critical]&#x27;).checked,
          enabled: row.querySelector(&#x27;[data-skill-enabled]&#x27;).checked
        }));
      }

      function readHeals() {
        return Array.from(root.querySelectorAll(&#x27;[data-heal-row]&#x27;)).map((row, index) =&gt; ({
          index,
          name: row.querySelector(&#x27;[data-heal-name]&#x27;).value.trim() || `治疗技能${index + 1}`,
          multiplier: Number(row.querySelector(&#x27;[data-heal-multiplier]&#x27;).value) / 100 || 0,
          observed: Number(row.querySelector(&#x27;[data-heal-observed]&#x27;).value) || 0,
          enabled: row.querySelector(&#x27;[data-heal-enabled]&#x27;).checked
        }));
      }

      function readRageValues() {
        return byId(&#x27;cdc-rage-values&#x27;).value
          .split(/[^0-9.+-]+/)
          .map((value) =&gt; Number(value))
          .filter((value) =&gt; Number.isFinite(value) &amp;&amp; value &gt;= 0);
      }

      function normalizeSpecialEffect(value) {
        return [&#x27;infusion&#x27;, &#x27;overlay&#x27;].includes(value) ? value : &#x27;none&#x27;;
      }

      function renderSpecialEffectCard() {
        specialEffect = normalizeSpecialEffect(specialEffect);
        root.querySelectorAll(&#x27;[data-special-effect-option]&#x27;).forEach((button) =&gt; {
          button.setAttribute(&#x27;aria-pressed&#x27;, String(button.dataset.specialEffectOption === specialEffect));
        });
        const card = byId(&#x27;cdc-special-effect-card&#x27;);
        card.hidden = workspaceMode !== &#x27;damage&#x27; || specialEffect === &#x27;none&#x27;;
        if (specialEffect === &#x27;none&#x27;) return;
        const name = specialEffect === &#x27;overlay&#x27; ? &#x27;覆纹&#x27; : &#x27;浸染&#x27;;
        byId(&#x27;cdc-special-effect-name&#x27;).textContent = name;
        byId(&#x27;cdc-special-effect-formula&#x27;).textContent = `独立倍率 = 1 + ${format(formulaSettings.specialBaseBonus * 100)}% + 最终环合强度 / ${format(formulaSettings.specialFusionDivisor)}`;
      }

      function setSpecialEffect(value) {
        specialEffect = normalizeSpecialEffect(value);
        renderSpecialEffectCard();
        updateCalculatorType();
      }

      function needsFusionStrength() {
        return workspaceMode === &#x27;damage&#x27; &amp;&amp; (specialEffect !== &#x27;none&#x27;
          || Array.from(root.querySelectorAll(&#x27;[data-skill-row]&#x27;)).filter(skillRowBelongsToWorkspace)
            .some((row) =&gt; [&#x27;creation&#x27;, &#x27;turbid&#x27;, &#x27;darkstar&#x27;].includes(row.querySelector(&#x27;[data-skill-model]&#x27;).value)));
      }

      function needsInclinationTeam() {
        return workspaceMode === &#x27;inclination&#x27;;
      }

      function skillRowBelongsToWorkspace(row) {
        const inclination = row.querySelector(&#x27;[data-skill-model]&#x27;).value === &#x27;inclination&#x27;;
        return workspaceMode === &#x27;inclination&#x27; ? inclination : !inclination;
      }

      function skillTagForRow(row) {
        const model = row.querySelector(&#x27;[data-skill-model]&#x27;).value;
        if (model === &#x27;turbid&#x27;) return &#x27;dot&#x27;;
        return model === &#x27;skill&#x27; &amp;&amp; row.querySelector(&#x27;[data-skill-tag]&#x27;).value === &#x27;dot&#x27; ? &#x27;dot&#x27; : &#x27;direct&#x27;;
      }

      function updateCalculatorType() {
        const damageMode = calculatorType === &#x27;damage&#x27;;
        const inclinationMode = workspaceMode === &#x27;inclination&#x27;;
        if (!damageMode) verificationMode = &#x27;normal&#x27;;
        if (inclinationMode) verificationMode = &#x27;normal&#x27;;
        root.dataset.workspaceMode = workspaceMode;
        root.querySelectorAll(&#x27;[data-calculator-type]&#x27;).forEach((button) =&gt; {
          const active = button.dataset.calculatorType === workspaceMode;
          button.classList.toggle(&#x27;btn-primary&#x27;, active);
          button.setAttribute(&#x27;aria-pressed&#x27;, String(active));
        });
        root.querySelectorAll(&#x27;[data-damage-only]&#x27;).forEach((element) =&gt; { element.hidden = !damageMode; });
        root.querySelectorAll(&#x27;[data-heal-only]&#x27;).forEach((element) =&gt; { element.hidden = damageMode; });
        root.querySelectorAll(&#x27;[data-effect-damage-field]&#x27;).forEach((element) =&gt; { element.hidden = !damageMode; });
        root.querySelectorAll(&#x27;[data-effect-heal-field]&#x27;).forEach((element) =&gt; { element.hidden = damageMode; });
        byId(&#x27;cdc-panel-section&#x27;).hidden = inclinationMode;
        const ordinaryDamageSelectors = [
          &#x27;[data-effect-attack]&#x27;, &#x27;[data-effect-damage]&#x27;, &#x27;[data-effect-dot-damage]&#x27;, &#x27;[data-effect-crit]&#x27;,
          &#x27;[data-effect-skill]&#x27;, &#x27;[data-effect-skill-multiply]&#x27;, &#x27;[data-edit-effect-scope]&#x27;
        ].join(&#x27;,&#x27;);
        root.querySelectorAll(ordinaryDamageSelectors).forEach((element) =&gt; {
          const field = element.closest(&#x27;label, button&#x27;);
          if (field) field.hidden = inclinationMode || !damageMode;
        });
        const specialPicker = root.querySelector(&#x27;.special-effect-picker&#x27;);
        if (specialPicker) specialPicker.hidden = inclinationMode || !damageMode;
        const showInclination = needsInclinationTeam();
        byId(&#x27;cdc-skill-section-title&#x27;).textContent = inclinationMode ? &#x27;倾陷实测值&#x27; : &#x27;伤害技能、倍率与实测伤害&#x27;;
        byId(&#x27;cdc-add-skill&#x27;).textContent = inclinationMode ? &#x27;添加倾陷实测&#x27; : &#x27;添加伤害技能&#x27;;
        root.querySelectorAll(&#x27;[data-inclination-only], [data-effect-inclination-field]&#x27;).forEach((element) =&gt; {
          element.hidden = !showInclination;
        });
        if (showInclination &amp;&amp; !root.querySelector(&#x27;[data-inclination-row]&#x27;)) addInclinationContributor(&#x27;角色一&#x27;);
        if (showInclination &amp;&amp; !Array.from(root.querySelectorAll(&#x27;[data-skill-row]&#x27;)).some((row) =&gt; row.querySelector(&#x27;[data-skill-model]&#x27;).value === &#x27;inclination&#x27;)) {
          addSkill(&#x27;倾陷小队合计&#x27;, &#x27;inclination&#x27;, 0, 0, false, true);
        }
        root.querySelectorAll(&#x27;[data-skill-row]&#x27;).forEach((row) =&gt; {
          const model = row.querySelector(&#x27;[data-skill-model]&#x27;).value;
          const normalModel = model === &#x27;skill&#x27;;
          if (model === &#x27;turbid&#x27;) row.querySelector(&#x27;[data-skill-tag]&#x27;).value = &#x27;dot&#x27;;
          else if (!normalModel) row.querySelector(&#x27;[data-skill-tag]&#x27;).value = &#x27;direct&#x27;;
          const tagField = row.querySelector(&#x27;[data-skill-tag-field]&#x27;);
          const multiplierField = row.querySelector(&#x27;[data-skill-multiplier-field]&#x27;);
          if (tagField) tagField.hidden = !normalModel;
          if (multiplierField) multiplierField.hidden = !normalModel;
          const criticalField = row.querySelector(&#x27;[data-skill-critical-field]&#x27;);
          if (criticalField) criticalField.hidden = verificationMode === &#x27;rage&#x27; || model === &#x27;inclination&#x27;;
          if (model === &#x27;inclination&#x27;) row.querySelector(&#x27;[data-skill-critical]&#x27;).checked = false;
        });
        const showFusion = needsFusionStrength();
        root.querySelectorAll(&#x27;[data-fusion-field], [data-effect-fusion-field]&#x27;).forEach((element) =&gt; {
          element.hidden = !showFusion;
        });
        renderSpecialEffectCard();
        updateVerificationMode();
        updateSkillPagination();
        scheduleLivePreview();
      }

      function updateVerificationMode() {
        root.querySelectorAll(&#x27;[data-verification-mode]&#x27;).forEach((button) =&gt; {
          const active = button.dataset.verificationMode === verificationMode;
          button.classList.toggle(&#x27;btn-primary&#x27;, active);
          button.setAttribute(&#x27;aria-pressed&#x27;, String(active));
        });
        byId(&#x27;cdc-rage-input&#x27;).hidden = calculatorType !== &#x27;damage&#x27; || verificationMode !== &#x27;rage&#x27;;
        byId(&#x27;cdc-verification-modes&#x27;).parentElement.hidden = workspaceMode === &#x27;inclination&#x27;;
        root.querySelectorAll(&#x27;[data-normal-skill-field]&#x27;).forEach((field) =&gt; {
          field.hidden = verificationMode === &#x27;rage&#x27;;
        });
        root.querySelectorAll(&#x27;[data-skill-row]&#x27;).forEach((row) =&gt; {
          const criticalField = row.querySelector(&#x27;[data-skill-critical-field]&#x27;);
          if (criticalField) criticalField.hidden = verificationMode === &#x27;rage&#x27; || row.querySelector(&#x27;[data-skill-model]&#x27;).value === &#x27;inclination&#x27;;
        });
        root.querySelectorAll(&#x27;[data-skill-enabled-label]&#x27;).forEach((label) =&gt; {
          label.textContent = verificationMode === &#x27;rage&#x27; ? &#x27;作为候选来源&#x27; : &#x27;纳入验算&#x27;;
        });
        byId(&#x27;cdc-run-verification&#x27;).textContent = calculatorType === &#x27;heal&#x27;
          ? &#x27;确定并开始治疗验算&#x27;
          : workspaceMode === &#x27;inclination&#x27; ? &#x27;确定并开始倾陷验算&#x27;
          : verificationMode === &#x27;rage&#x27; ? &#x27;确定并开始溯源&#x27; : &#x27;确定并开始验算&#x27;;
        byId(&#x27;cdc-search-scope-note&#x27;).textContent = calculatorType === &#x27;heal&#x27;
          ? &#x27;治疗验算固定基础区，只反推实际进入治疗公式的 Buff。&#x27;
          : workspaceMode === &#x27;inclination&#x27;
            ? &#x27;倾陷按角色分别结算；预览假设全部参与搜索/锁定 Buff 生效，自动叠层取满层、固定层按填写值。&#x27;
          : verificationMode === &#x27;rage&#x27;
            ? &#x27;狂暴溯源会验算相关基础区失效，并自动排除候选来源公式不读取的 Buff。&#x27;
            : &#x27;常规验算固定基础区，只反推当前技能公式实际读取的 Buff。&#x27;;
      }

      function updateSkillPagination(goToLast = false) {
        const allRows = Array.from(root.querySelectorAll(&#x27;[data-skill-row]&#x27;));
        const rows = allRows.filter(skillRowBelongsToWorkspace);
        const pageCount = Math.max(1, Math.ceil(rows.length / SKILL_PAGE_SIZE));
        if (goToLast) skillPage = pageCount - 1;
        skillPage = Math.max(0, Math.min(skillPage, pageCount - 1));
        allRows.forEach((row) =&gt; { row.hidden = true; });
        rows.forEach((row, index) =&gt; {
          row.hidden = index &lt; skillPage * SKILL_PAGE_SIZE || index &gt;= (skillPage + 1) * SKILL_PAGE_SIZE;
        });
        byId(&#x27;cdc-skill-page&#x27;).textContent = `${workspaceMode === &#x27;inclination&#x27; ? &#x27;倾陷记录&#x27; : &#x27;技能&#x27;} · 第 ${skillPage + 1}/${pageCount} 页 · 共 ${rows.length} 项`;
        byId(&#x27;cdc-skill-prev&#x27;).disabled = skillPage === 0;
        byId(&#x27;cdc-skill-next&#x27;).disabled = skillPage &gt;= pageCount - 1;
      }

      function renderDetailPage() {
        const pageCount = Math.max(1, Math.ceil(detailRows.length / DETAIL_PAGE_SIZE));
        detailPage = Math.max(0, Math.min(detailPage, pageCount - 1));
        const start = detailPage * DETAIL_PAGE_SIZE;
        byId(&#x27;cdc-best-details&#x27;).innerHTML = detailRows.slice(start, start + DETAIL_PAGE_SIZE).join(&#x27;&#x27;);
        byId(&#x27;cdc-detail-page&#x27;).textContent = `第 ${detailPage + 1}/${pageCount} 页 · 共 ${detailRows.length} 项`;
        byId(&#x27;cdc-detail-prev&#x27;).disabled = detailPage === 0;
        byId(&#x27;cdc-detail-next&#x27;).disabled = detailPage &gt;= pageCount - 1;
      }

      function captureData() {
        const scalarIds = [&#x27;cdc-character&#x27;, &#x27;cdc-version&#x27;, &#x27;cdc-panel&#x27;, &#x27;cdc-base&#x27;, &#x27;cdc-atk-bonus&#x27;,
          &#x27;cdc-heal-bonus&#x27;, &#x27;cdc-char-level&#x27;, &#x27;cdc-enemy-level&#x27;, &#x27;cdc-resistance&#x27;, &#x27;cdc-fusion&#x27;,
          &#x27;cdc-penetration&#x27;, &#x27;cdc-res-shred&#x27;, &#x27;cdc-general&#x27;, &#x27;cdc-elemental&#x27;, &#x27;cdc-extra&#x27;, &#x27;cdc-crit&#x27;,
          &#x27;cdc-rage-values&#x27;, &#x27;cdc-search-strength&#x27;];
        const scalars = {};
        scalarIds.forEach((id) =&gt; { scalars[id] = byId(id).value; });
        const effects = Array.from(root.querySelectorAll(&#x27;[data-effect-row]&#x27;)).map((row) =&gt; ({

          priority: row.querySelector(&#x27;[data-effect-priority]&#x27;).checked,
          scopeMode: normalizedScopeMode(row.dataset.scopeMode),
          scopeSkillIds: effectScopeSkillIds(row),
          inclinationScopeMode: row.dataset.inclinationScopeMode === &#x27;custom&#x27; ? &#x27;custom&#x27; : &#x27;all&#x27;,
          inclinationContributorIds: inclinationScopeContributorIds(row),
          stackEnabled: row.querySelector(&#x27;[data-effect-stack-enabled]&#x27;).checked,
          stackMode: row.querySelector(&#x27;[data-effect-stack-mode]&#x27;).value === &#x27;fixed&#x27; ? &#x27;fixed&#x27; : &#x27;auto&#x27;,
          maxStacks: boundedStackValue(row.querySelector(&#x27;[data-effect-max-stacks]&#x27;).value, 6, 1),
          fixedStacks: boundedStackValue(row.querySelector(&#x27;[data-effect-fixed-stacks]&#x27;).value, 0, 0),
          attack: Number(row.querySelector(&#x27;[data-effect-attack]&#x27;).value) || 0,
          penetration: Number(row.querySelector(&#x27;[data-effect-penetration]&#x27;).value) || 0,
          resShred: Number(row.querySelector(&#x27;[data-effect-res-shred]&#x27;).value) || 0,
          damage: Number(row.querySelector(&#x27;[data-effect-damage]&#x27;).value) || 0,
          dotDamage: Number(row.querySelector(&#x27;[data-effect-dot-damage]&#x27;).value) || 0,
          inclinationDamage: Number(row.querySelector(&#x27;[data-effect-inclination-damage]&#x27;).value) || 0,
          crit: Number(row.querySelector(&#x27;[data-effect-crit]&#x27;).value) || 0,
          skill: Number(row.querySelector(&#x27;[data-effect-skill]&#x27;).value) || 0,
          skillMultiply: row.querySelector(&#x27;[data-effect-skill-multiply]&#x27;).checked,
          fusionPercent: Number(row.querySelector(&#x27;[data-effect-fusion-percent]&#x27;).value) || 0,
          fusionFlat: Number(row.querySelector(&#x27;[data-effect-fusion-flat]&#x27;).value) || 0,
          healBonus: Number(row.querySelector(&#x27;[data-effect-heal-bonus]&#x27;).value) || 0
        }));
        const skills = Array.from(root.querySelectorAll(&#x27;[data-skill-row]&#x27;)).map((row) =&gt; ({
          id: row.dataset.skillId,
          name: row.querySelector(&#x27;[data-skill-name]&#x27;).value,
          model: row.querySelector(&#x27;[data-skill-model]&#x27;).value,
          tag: skillTagForRow(row),
          multiplier: Number(row.querySelector(&#x27;[data-skill-multiplier]&#x27;).value) || 0,
          observed: Number(row.querySelector(&#x27;[data-skill-observed]&#x27;).value) || 0,
          critical: row.querySelector(&#x27;[data-skill-critical]&#x27;).checked,
          enabled: row.querySelector(&#x27;[data-skill-enabled]&#x27;).checked
        }));
        const heals = Array.from(root.querySelectorAll(&#x27;[data-heal-row]&#x27;)).map((row) =&gt; ({
          name: row.querySelector(&#x27;[data-heal-name]&#x27;).value,
          multiplier: Number(row.querySelector(&#x27;[data-heal-multiplier]&#x27;).value) || 0,
          observed: Number(row.querySelector(&#x27;[data-heal-observed]&#x27;).value) || 0,
          enabled: row.querySelector(&#x27;[data-heal-enabled]&#x27;).checked
        }));
        const inclinationContributors = readInclinationContributors().map((item) =&gt; ({
          ...item,
          damage: item.damage * 100,
          penetration: item.penetration * 100,
          resShred: item.resShred * 100,
          specialBonus: item.specialBonus * 100
        }));
        return {
          schema: 10,
          calculatorType,
          workspaceMode,
          mode: verificationMode,
          formulaSettings: { ...formulaSettings },
          scalars,
          options: {
            specialEffect
          },
          effects,
          skills,
          heals,
          inclinationContributors
        };
      }

      function applyData(data) {
        if (!data || !data.scalars) return false;
        restoring = true;
        byId(&#x27;cdc-heal-bonus&#x27;).value = &#x27;0&#x27;;
        byId(&#x27;cdc-fusion&#x27;).value = &#x27;360&#x27;;
        Object.entries(data.scalars).forEach(([id, value]) =&gt; {
          const element = byId(id);
          if (element) element.value = value;
        });
        const storedFusion = Number(byId(&#x27;cdc-fusion&#x27;).value);
        byId(&#x27;cdc-fusion&#x27;).value = String(Number.isFinite(storedFusion)
          ? Math.max(0, Math.min(360, storedFusion))
          : 0);
        specialEffect = normalizeSpecialEffect(data.options?.specialEffect
          || (data.options?.infusionEnabled ? &#x27;infusion&#x27; : &#x27;&#x27;)
          || (data.options?.specialEnabled ? &#x27;overlay&#x27; : &#x27;none&#x27;));
        if (data.formulaSettings) {
          formulaSettings = normalizeFormulaSettings(data.formulaSettings);
          persistFormulaSettings();
          syncFormulaEditor();
        }
        byId(&#x27;cdc-effects&#x27;).innerHTML = &#x27;&#x27;;
        byId(&#x27;cdc-skills&#x27;).innerHTML = &#x27;&#x27;;
        byId(&#x27;cdc-heals&#x27;).innerHTML = &#x27;&#x27;;
        byId(&#x27;cdc-inclination-contributors&#x27;).innerHTML = &#x27;&#x27;;
        (data.effects || []).forEach((effect) =&gt; addEffect(effect.name, effect));
        (data.skills || []).forEach((skill) =&gt; addSkill(skill.name, skill.model, skill.multiplier, skill.observed, skill.critical, skill.enabled, skill.tag, skill.id));
        (data.heals || []).forEach((heal) =&gt; addHeal(heal.name, heal.multiplier, heal.observed, heal.enabled));
        (data.inclinationContributors || []).forEach((item) =&gt; addInclinationContributor(item.name, item, item.id));
        workspaceMode = [&#x27;damage&#x27;, &#x27;heal&#x27;, &#x27;inclination&#x27;].includes(data.workspaceMode)
          ? data.workspaceMode
          : data.calculatorType === &#x27;heal&#x27; ? &#x27;heal&#x27;
            : (data.skills || []).some((skill) =&gt; skill.model === &#x27;inclination&#x27;) ? &#x27;inclination&#x27; : &#x27;damage&#x27;;
        calculatorType = workspaceMode === &#x27;heal&#x27; ? &#x27;heal&#x27; : &#x27;damage&#x27;;
        verificationMode = calculatorType === &#x27;damage&#x27; &amp;&amp; data.mode === &#x27;rage&#x27; ? &#x27;rage&#x27; : &#x27;normal&#x27;;
        updateCalculatorType();
        updateAllEffectScopeSummaries();
        updateAllInclinationScopeSummaries();
        skillPage = 0;
        detailPage = 0;
        updateSkillPagination();
        restoring = false;
        markDirty();
        scheduleDraftSave();
        return true;
      }

      function clearCurrentConfiguration() {
        if (!window.confirm(&#x27;清空当前输入和当前草稿？已保存的角色/版本配置不会删除。&#x27;)) return;
        const scalarIds = [&#x27;cdc-character&#x27;, &#x27;cdc-version&#x27;, &#x27;cdc-panel&#x27;, &#x27;cdc-base&#x27;, &#x27;cdc-atk-bonus&#x27;,
          &#x27;cdc-heal-bonus&#x27;, &#x27;cdc-char-level&#x27;, &#x27;cdc-enemy-level&#x27;, &#x27;cdc-resistance&#x27;, &#x27;cdc-fusion&#x27;,
          &#x27;cdc-penetration&#x27;, &#x27;cdc-res-shred&#x27;, &#x27;cdc-general&#x27;, &#x27;cdc-elemental&#x27;, &#x27;cdc-extra&#x27;, &#x27;cdc-crit&#x27;,
          &#x27;cdc-rage-values&#x27;, &#x27;cdc-search-strength&#x27;];
        const scalars = {};
        scalarIds.forEach((id) =&gt; { scalars[id] = &#x27;&#x27;; });
        scalars[&#x27;cdc-search-strength&#x27;] = &#x27;deep&#x27;;
        applyData({ schema: 10, calculatorType: &#x27;damage&#x27;, workspaceMode: &#x27;damage&#x27;, mode: &#x27;normal&#x27;, formulaSettings: { ...formulaSettings }, scalars, options: { specialEffect: &#x27;none&#x27; }, effects: [], skills: [], heals: [], inclinationContributors: [] });
        clearTimeout(draftTimer);
        try {
          localStorage.setItem(DRAFT_STORAGE_KEY, JSON.stringify(captureData()));
          byId(&#x27;cdc-profile-status&#x27;).textContent = &#x27;已清空当前配置；已保存档案未变更&#x27;;
        } catch (_error) {
          byId(&#x27;cdc-profile-status&#x27;).textContent = &#x27;当前配置已清空，但本地记忆不可用&#x27;;
        }
        byId(&#x27;cdc-run-status&#x27;).textContent = &#x27;当前配置已清空&#x27;;
      }

      function readStoredProfiles() {
        try { return JSON.parse(localStorage.getItem(PROFILE_STORAGE_KEY) || &#x27;{}&#x27;); }
        catch (_error) { return {}; }
      }

      function writeStoredProfiles(profiles) {
        try { localStorage.setItem(PROFILE_STORAGE_KEY, JSON.stringify(profiles)); return true; }
        catch (_error) { byId(&#x27;cdc-profile-status&#x27;).textContent = &#x27;本地保存不可用&#x27;; return false; }
      }

      function refreshProfileSelect(selectedKey = &#x27;&#x27;) {
        const profiles = readStoredProfiles();
        const keys = Object.keys(profiles).sort((a, b) =&gt; a.localeCompare(b, &#x27;zh-CN&#x27;));
        byId(&#x27;cdc-profile-select&#x27;).innerHTML = keys.length
          ? keys.map((key) =&gt; `&lt;option value=&quot;${escapeHtml(key)}&quot;&gt;${escapeHtml(key)}&lt;/option&gt;`).join(&#x27;&#x27;)
          : &#x27;&lt;option value=&quot;&quot;&gt;暂无已保存配置&lt;/option&gt;&#x27;;
        if (selectedKey &amp;&amp; profiles[selectedKey]) byId(&#x27;cdc-profile-select&#x27;).value = selectedKey;
      }

      function profileKey() {
        const character = byId(&#x27;cdc-character&#x27;).value.trim();
        const version = byId(&#x27;cdc-version&#x27;).value.trim();
        return character &amp;&amp; version ? `${character} · ${version}` : &#x27;&#x27;;
      }

      function scheduleDraftSave() {
        if (restoring) return;
        clearTimeout(draftTimer);
        draftTimer = setTimeout(() =&gt; {
          try {
            localStorage.setItem(DRAFT_STORAGE_KEY, JSON.stringify(captureData()));
            byId(&#x27;cdc-profile-status&#x27;).textContent = &#x27;当前草稿已自动记忆&#x27;;
          } catch (_error) {
            byId(&#x27;cdc-profile-status&#x27;).textContent = &#x27;本地记忆不可用&#x27;;
          }
        }, 250);
      }

      const baseAtoms = [
        { id: &#x27;base-attack&#x27;, label: &#x27;基础攻击加成&#x27;, component: &#x27;baseAttack&#x27;, modes: [&#x27;damage&#x27;, &#x27;heal&#x27;] },

        { id: &#x27;base-extra&#x27;, label: &#x27;额外增伤&#x27;, component: &#x27;baseExtra&#x27;, modes: [&#x27;damage&#x27;] },
        { id: &#x27;base-crit&#x27;, label: &#x27;面板暴击伤害&#x27;, component: &#x27;baseCrit&#x27;, modes: [&#x27;damage&#x27;] },
        { id: &#x27;zone-defense&#x27;, label: &#x27;防御区整体&#x27;, component: &#x27;zoneDefense&#x27;, modes: [&#x27;damage&#x27;] },

        { id: &#x27;zone-heal-bonus&#x27;, label: &#x27;治疗加成区整体&#x27;, component: &#x27;zoneHealBonus&#x27;, modes: [&#x27;heal&#x27;] }
      ];
      const componentLabels = {
        attack: &#x27;攻击加成&#x27;, penetration: &#x27;防御穿透&#x27;, resShred: &#x27;抗性削弱&#x27;, damage: &#x27;增伤&#x27;, dotDamage: &#x27;持续伤害强化&#x27;,
