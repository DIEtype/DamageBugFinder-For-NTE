  padding: 0;

  height: 20px;

}

}

svg {

  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;compact-damage-calculator&#x27;);
      const byId = (id) =&gt; root.querySelector(&#x27;#&#x27; + id);
      const number = (id) =&gt; Number(byId(id).value) || 0;
      const percent = (id) =&gt; number(id) / 100;
      const format = (value) =&gt; Number.isFinite(value)
        ? value.toLocaleString(&#x27;zh-CN&#x27;, { maximumFractionDigits: 6 })
        : &#x27;—&#x27;;
      const escapeHtml = (value) =&gt; String(value).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, (character) =&gt; ({
        &#x27;&amp;&#x27;: &#x27;&amp;amp;&#x27;, &#x27;&lt;&#x27;: &#x27;&amp;lt;&#x27;, &#x27;&gt;&#x27;: &#x27;&amp;gt;&#x27;, &#x27;&quot;&#x27;: &#x27;&amp;quot;&#x27;, &quot;&#x27;&quot;: &#x27;&amp;#39;&#x27;
      })[character]);
      let rowCounter = 0;
      let calculatorType = &#x27;damage&#x27;;
      let workspaceMode = &#x27;damage&#x27;;
      let verificationMode = &#x27;normal&#x27;;
      let skillPage = 0;
      let detailPage = 0;
      let detailRows = [];
      let draftTimer = null;
      let previewFrame = null;
      let restoring = false;
      let verificationDirty = false;
      let editingEffectScopeRow = null;
      let editingInclinationScopeRow = null;
      const SKILL_PAGE_SIZE = 3;
      const DETAIL_PAGE_SIZE = 3;
      const REPORT_ERROR_LIMIT = 20;
      const SEARCH_PRESETS = {
        standard: { label: &#x27;标准&#x27;, exactLimit: 18, beamWidth: 5000 },
        deep: { label: &#x27;深度&#x27;, exactLimit: 20, beamWidth: 20000 },
        extreme: { label: &#x27;极限&#x27;, exactLimit: 22, beamWidth: 50000 }
      };
      const EXACT_RESULT_KEEP = 300;
      const PROFILE_STORAGE_KEY = &#x27;game-calculator-profiles-v1&#x27;;
      const DRAFT_STORAGE_KEY = &#x27;game-calculator-draft-v1&#x27;;
      const FORMULA_SETTINGS_STORAGE_KEY = &#x27;game-calculator-formula-settings-v1&#x27;;
      const CAPTURE_SIDECAR_STORAGE_KEY = &#x27;nte-capture-sidecar-v1&#x27;;
      const CAPTURE_MAPPING_STORAGE_KEY = &#x27;nte-capture-mappings-v1&#x27;;
      const DEFAULT_FORMULA_SETTINGS = Object.freeze({
        creationBase: 9000,
        turbidBase: 2700,
        darkstarBase: 45000,
        fusionDivisor: 600,
        specialBaseBonus: 0.2,
        specialFusionDivisor: 1400,
        inclinationBase: 3603,
        inclinationCapDivisor: 3
      });
      function normalizeFormulaSettings(value = {}) {
        const nonNegative = (candidate, fallback) =&gt; {
          const parsed = Number(candidate);
          return Number.isFinite(parsed) &amp;&amp; parsed &gt;= 0 ? parsed : fallback;
        };
        return {
          creationBase: nonNegative(value.creationBase, DEFAULT_FORMULA_SETTINGS.creationBase),
          turbidBase: nonNegative(value.turbidBase, DEFAULT_FORMULA_SETTINGS.turbidBase),
          darkstarBase: nonNegative(value.darkstarBase, DEFAULT_FORMULA_SETTINGS.darkstarBase),
          fusionDivisor: Math.max(1, nonNegative(value.fusionDivisor, DEFAULT_FORMULA_SETTINGS.fusionDivisor)),
          specialBaseBonus: nonNegative(value.specialBaseBonus, DEFAULT_FORMULA_SETTINGS.specialBaseBonus),
          specialFusionDivisor: Math.max(1, nonNegative(value.specialFusionDivisor, DEFAULT_FORMULA_SETTINGS.specialFusionDivisor)),
          inclinationBase: nonNegative(value.inclinationBase, DEFAULT_FORMULA_SETTINGS.inclinationBase),
          inclinationCapDivisor: Math.max(1, nonNegative(value.inclinationCapDivisor, DEFAULT_FORMULA_SETTINGS.inclinationCapDivisor))
        };
      }
      function readStoredFormulaSettings() {
        try { return normalizeFormulaSettings(JSON.parse(localStorage.getItem(FORMULA_SETTINGS_STORAGE_KEY) || &#x27;{}&#x27;)); }
        catch (_error) { return { ...DEFAULT_FORMULA_SETTINGS }; }
      }
      let formulaSettings = readStoredFormulaSettings();
      let specialEffect = &#x27;none&#x27;;
      const INCLINATION_PRESET = Object.freeze({
        name: &#x27;塞润尼缇（高危6）&#x27;,
        enemyLevel: 90,
        cap: 70,
        resistances: Object.freeze({ light: 0.2, phase: 0.2, dark: 0.2, spirit: 0.2, soul: 0.2, curse: 0.16, mind: 0.2 })
      });
      const OCR_TARGETS = {
        panel_attack: { label: &#x27;非战斗面板攻击&#x27;, input: &#x27;cdc-panel&#x27; },
        base_attack: { label: &#x27;基础攻击&#x27;, input: &#x27;cdc-base&#x27; },
        character_level: { label: &#x27;角色等级&#x27;, input: &#x27;cdc-char-level&#x27; },
        crit_damage: { label: &#x27;面板暴击伤害&#x27;, input: &#x27;cdc-crit&#x27;, suffix: &#x27;%&#x27; },
        general_bonus: { label: &#x27;通用增伤&#x27;, input: &#x27;cdc-general&#x27;, suffix: &#x27;%&#x27; },
        elemental_bonus: { label: &#x27;属性增伤&#x27;, input: &#x27;cdc-elemental&#x27;, suffix: &#x27;%&#x27; },
        fusion_strength: { label: &#x27;基础环合强度&#x27;, input: &#x27;cdc-fusion&#x27; },
        healing_bonus: { label: &#x27;基础治疗加成&#x27;, input: &#x27;cdc-heal-bonus&#x27;, suffix: &#x27;%&#x27; }
      };
      const OCR_ORDER = Object.keys(OCR_TARGETS);
      const desktopRequests = new Map();
      let desktopRequestId = 0;
      let desktopApiAvailable = false;
      let ocrCaptures = [];
      let ocrMergedRows = [];
      let captureGroups = [];
      let captureRawEvents = [];
      let captureRawSelectedId = &#x27;&#x27;;
      let captureCoreAudit = [];
      let captureCoreAuditPath = &#x27;&#x27;;
      let capturePollTimer = null;
      let captureMarker = null;
      let packetCaptureState = &#x27;idle&#x27;;

      function formulaTraceMarkup(factors) {
        return `&lt;div class=&quot;formula-trace&quot;&gt;${factors.map((factor, index) =&gt; {
          const kind = [&#x27;base&#x27;, &#x27;attack&#x27;, &#x27;defense&#x27;, &#x27;resistance&#x27;, &#x27;damage&#x27;, &#x27;skill&#x27;, &#x27;fusion&#x27;, &#x27;dot&#x27;, &#x27;crit&#x27;, &#x27;independent&#x27;].includes(factor.kind)
            ? factor.kind : &#x27;independent&#x27;;
          const value = factor.display ?? format(factor.value);
          const note = factor.note ? ` title=&quot;${escapeHtml(factor.note)}&quot;` : &#x27;&#x27;;
          const operator = factor.operator !== undefined ? factor.operator : &#x27;×&#x27;;
          return `${index &amp;&amp; operator ? `&lt;span class=&quot;formula-times&quot;&gt;${escapeHtml(operator)}&lt;/span&gt;` : &#x27;&#x27;}&lt;span class=&quot;formula-factor factor-${kind}&quot;${note}&gt;&lt;small&gt;${escapeHtml(factor.label)}&lt;/small&gt;&lt;strong&gt;${escapeHtml(value)}&lt;/strong&gt;&lt;/span&gt;`;
        }).join(&#x27;&#x27;)}&lt;/div&gt;`;
      }

      function renderFormulaCatalog() {
        const catalog = byId(&#x27;cdc-formula-catalog&#x27;);
        if (!catalog) return;
        const fusion = `1 + 最终环合 / ${format(formulaSettings.fusionDivisor)}`;
        const targeted = &#x27;仅自定义点名时 1 + 指定增伤&#x27;;
        const cards = [
          {
            model: &#x27;skill&#x27;,
            title: &#x27;常规伤害 / 持续伤害&#x27;,
            note: &#x27;持续伤害额外读取持续伤害强化；浸染或覆纹只作用于常规模型，并读取该验算假设中的最终环合强度。&#x27;,
            factors: [
              { kind: &#x27;attack&#x27;, label: &#x27;战斗攻击&#x27;, display: &#x27;面板 + 基攻×攻击加成&#x27; },
              { kind: &#x27;defense&#x27;, label: &#x27;防御区&#x27;, display: &#x27;等级与穿透&#x27; },
              { kind: &#x27;resistance&#x27;, label: &#x27;抗性区&#x27;, display: &#x27;抗性与削弱&#x27; },

      function enableDesktopOcr() {
        desktopApiAvailable = true;
        byId(&#x27;cdc-ocr-entry&#x27;).hidden = false;
        byId(&#x27;cdc-open-capture&#x27;).hidden = false;
      }

      function callDesktopApi(method, ...args) {
        if (window.pywebview &amp;&amp; window.pywebview.api &amp;&amp; typeof window.pywebview.api[method] === &#x27;function&#x27;) {
          return window.pywebview.api[method](...args);
        }
        if (window.parent === window) return Promise.reject(new Error(&#x27;此功能需要 Windows 桌面版。&#x27;));
        desktopRequestId += 1;
        const id = `cdc-${Date.now()}-${desktopRequestId}`;
        return new Promise((resolve, reject) =&gt; {
          const timer = setTimeout(() =&gt; {
            desktopRequests.delete(id);
            reject(new Error(&#x27;桌面功能响应超时。&#x27;));
          }, 90000);
          desktopRequests.set(id, { resolve, reject, timer });
          window.parent.postMessage({ type: &#x27;cdc-api-call&#x27;, id, method, args }, &#x27;*&#x27;);
        });
      }

      window.addEventListener(&#x27;message&#x27;, (event) =&gt; {
        const message = event.data || {};
        if (message.type === &#x27;cdc-api-ready&#x27;) {
          enableDesktopOcr();
          return;
        }
        if (message.type !== &#x27;cdc-api-result&#x27; || !desktopRequests.has(message.id)) return;
        const pending = desktopRequests.get(message.id);
        clearTimeout(pending.timer);
        desktopRequests.delete(message.id);
        if (message.ok) pending.resolve(message.result);
        else pending.reject(new Error(message.error || &#x27;桌面功能调用失败。&#x27;));
      });

      window.addEventListener(&#x27;pywebviewready&#x27;, enableDesktopOcr);
      if (document.body.dataset.cdcDesktop === &#x27;true&#x27;) enableDesktopOcr();
      if (window.parent !== window) window.parent.postMessage({ type: &#x27;cdc-api-probe&#x27; }, &#x27;*&#x27;);

      function ocrValueKey(candidate) {
        return `${candidate.attribute || &#x27;&#x27;}|${Number(candidate.value).toFixed(4)}`;
      }

      function mergeOcrCandidates() {
        const all = ocrCaptures.flatMap((capture) =&gt; (capture.analysis.fields || []).map((field) =&gt; ({
          ...field,
          source: capture.name
        })));
        const rows = [];
        OCR_ORDER.forEach((fieldName) =&gt; {
          let candidates = all.filter((candidate) =&gt; candidate.field === fieldName &amp;&amp; Number.isFinite(Number(candidate.value)));
          if (!candidates.length) return;
          if (fieldName === &#x27;elemental_bonus&#x27;) {
            const positive = candidates.filter((candidate) =&gt; Number(candidate.value) &gt; 0);
            if (positive.length) candidates = positive;
          }
          const groups = new Map();
          candidates.forEach((candidate) =&gt; {
            const key = ocrValueKey(candidate);
            if (!groups.has(key)) groups.set(key, []);
            groups.get(key).push(candidate);
          });
          const ranked = Array.from(groups.values()).sort((left, right) =&gt; {
            if (right.length !== left.length) return right.length - left.length;
            return Math.max(...right.map((item) =&gt; item.confidence || 0))
              - Math.max(...left.map((item) =&gt; item.confidence || 0));
          });
          const winning = ranked[0];
          const best = winning.slice().sort((a, b) =&gt; (b.confidence || 0) - (a.confidence || 0))[0];
          const confidence = Math.min(0.99, (best.confidence || 0.5) + Math.min(0.06, (winning.length - 1) * 0.03));
          const alternatives = ranked.slice(1).filter((group) =&gt; Number(group[0].value) !== Number(best.value));
          rows.push({
            ...best,
            confidence,
            agreement: winning.length,
            sources: Array.from(new Set(winning.map((item) =&gt; item.source))),
            conflict: alternatives.length &gt; 0,
            alternativeValues: alternatives.map((group) =&gt; group[0].value)
          });
        });
        return rows;
      }

      function renderOcrResults() {
        ocrMergedRows = mergeOcrCandidates();
        const body = byId(&#x27;cdc-ocr-results&#x27;);
        if (!ocrMergedRows.length) {
          body.innerHTML = &#x27;&lt;tr&gt;&lt;td colspan=&quot;6&quot; class=&quot;text-muted&quot;&gt;尚未识别到可填写字段。请确认截图中显示了角色属性面板。&lt;/td&gt;&lt;/tr&gt;&#x27;;
          byId(&#x27;cdc-apply-ocr&#x27;).disabled = true;
          byId(&#x27;cdc-ocr-summary&#x27;).textContent = ocrCaptures.length
            ? `已处理 ${ocrCaptures.length} 张截图，但没有可靠字段。可以继续捕获其他滚动位置。`
            : &#x27;建议至少捕获角色总览、详情上半段和详情下半段。&#x27;;
          return;
        }
        body.innerHTML = ocrMergedRows.map((row, index) =&gt; {
          const target = OCR_TARGETS[row.field];
          const attribute = row.field === &#x27;elemental_bonus&#x27; &amp;&amp; row.attribute ? `${row.attribute} · ` : &#x27;&#x27;;
          const valueText = `${attribute}${Number(row.value).toLocaleString(&#x27;zh-CN&#x27;, { maximumFractionDigits: 4 })}${target.suffix || &#x27;&#x27;}`;
          const conflict = row.conflict ? `；另有识别值 ${row.alternativeValues.join(&#x27;、&#x27;)}` : &#x27;&#x27;;
          const evidence = `${row.agreement} 次一致 · ${row.raw || row.sources.join(&#x27;、&#x27;)}${conflict}`;
          return `&lt;tr&gt;
            &lt;td&gt;&lt;label class=&quot;form-check&quot;&gt;&lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot; data-ocr-row=&quot;${index}&quot; checked&gt;&lt;span class=&quot;sr-only&quot;&gt;采用${escapeHtml(target.label)}&lt;/span&gt;&lt;/label&gt;&lt;/td&gt;
            &lt;td&gt;${escapeHtml(row.label || target.label)}&lt;/td&gt;
            &lt;td class=&quot;text-end text-nowrap&quot;&gt;${escapeHtml(valueText)}&lt;/td&gt;
            &lt;td&gt;${escapeHtml(target.label)}&lt;/td&gt;
            &lt;td class=&quot;text-nowrap${row.conflict ? &#x27; text-destructive&#x27; : &#x27;&#x27;}&quot;&gt;${Math.round(row.confidence * 100)}%${row.conflict ? &#x27; · 待核对&#x27; : &#x27;&#x27;}&lt;/td&gt;
            &lt;td class=&quot;text-small&quot;&gt;${escapeHtml(evidence)}&lt;/td&gt;
          &lt;/tr&gt;`;
        }).join(&#x27;&#x27;);
        byId(&#x27;cdc-apply-ocr&#x27;).disabled = false;
        const conflictCount = ocrMergedRows.filter((row) =&gt; row.conflict).length;
        byId(&#x27;cdc-ocr-summary&#x27;).textContent = `已合并 ${ocrCaptures.length} 张截图，得到 ${ocrMergedRows.length} 个可填写字段${conflictCount ? `；${conflictCount} 项存在冲突，请先核对` : &#x27;&#x27;}。`;
      }

      function addOcrCapture(result) {
        if (!result || !result.ok) throw new Error(result &amp;&amp; result.error ? result.error : &#x27;截图识别失败。&#x27;);
        ocrCaptures.push(result);
        if (result.preview) {
          byId(&#x27;cdc-ocr-preview&#x27;).src = result.preview;
          byId(&#x27;cdc-ocr-preview&#x27;).hidden = false;
        }
        renderOcrResults();
        const fieldCount = (result.analysis.fields || []).length;
        byId(&#x27;cdc-ocr-status&#x27;).textContent = `已处理 ${ocrCaptures.length} 张截图；最近一张识别到 ${fieldCount} 条候选字段。截图仅在本机处理。`;
      }

      async function refreshCaptureWindows() {
        const select = byId(&#x27;cdc-ocr-window&#x27;);
        const previous = select.value;
        select.innerHTML = &#x27;&lt;option value=&quot;&quot;&gt;正在读取窗口…&lt;/option&gt;&#x27;;
        try {
          const result = await callDesktopApi(&#x27;get_capture_windows&#x27;);
          if (!result.ok) throw new Error(result.error || &#x27;无法读取窗口列表。&#x27;);
          select.innerHTML = result.windows.length ? result.windows.map((item) =&gt;
            `&lt;option value=&quot;${escapeHtml(item.id)}&quot;&gt;${escapeHtml(item.title)}（${item.width}×${item.height}）&lt;/option&gt;`
          ).join(&#x27;&#x27;) : &#x27;&lt;option value=&quot;&quot;&gt;没有找到可捕获窗口&lt;/option&gt;&#x27;;
          if (previous &amp;&amp; result.windows.some((item) =&gt; item.id === previous)) select.value = previous;
          byId(&#x27;cdc-capture-panel&#x27;).disabled = !select.value;
        } catch (error) {
          select.innerHTML = &#x27;&lt;option value=&quot;&quot;&gt;读取失败&lt;/option&gt;&#x27;;
          byId(&#x27;cdc-capture-panel&#x27;).disabled = true;
          byId(&#x27;cdc-ocr-status&#x27;).textContent = error.message;
        }
      }

      async function captureCurrentPanel() {
        const button = byId(&#x27;cdc-capture-panel&#x27;);
        const windowId = byId(&#x27;cdc-ocr-window&#x27;).value;
        if (!windowId) return;
        const delay = Number(byId(&#x27;cdc-ocr-delay&#x27;).value) || 3;
        button.disabled = true;
        byId(&#x27;cdc-ocr-status&#x27;).textContent = `${delay} 秒后截图：计算器将暂时隐藏，请在游戏中打开或滚动到需要识别的位置。`;
        try {
          addOcrCapture(await callDesktopApi(&#x27;capture_panel&#x27;, windowId, delay));
        } catch (error) {
          byId(&#x27;cdc-ocr-status&#x27;).textContent = error.message;
        } finally {
          button.disabled = false;
        }
      }

      function readFileAsDataUrl(file) {
        return new Promise((resolve, reject) =&gt; {
          const reader = new FileReader();
          reader.onload = () =&gt; resolve(reader.result);
          reader.onerror = () =&gt; reject(new Error(`无法读取 ${file.name}`));
          reader.readAsDataURL(file);
        });
      }

      async function importOcrFiles(files) {
        const selected = Array.from(files).slice(0, 8);
        for (let index = 0; index &lt; selected.length; index += 1) {
          const file = selected[index];
          byId(&#x27;cdc-ocr-status&#x27;).textContent = `正在识别 ${index + 1}/${selected.length}：${file.name}`;
          try {
            const dataUrl = await readFileAsDataUrl(file);
            addOcrCapture(await callDesktopApi(&#x27;recognize_uploaded_image&#x27;, dataUrl, file.name));
          } catch (error) {
            byId(&#x27;cdc-ocr-status&#x27;).textContent = error.message;
            break;
          }
        }
      }

      function applyOcrResults() {
        const checked = Array.from(byId(&#x27;cdc-ocr-results&#x27;).querySelectorAll(&#x27;[data-ocr-row]:checked&#x27;));
        if (!checked.length) {
          byId(&#x27;cdc-ocr-status&#x27;).textContent = &#x27;请至少勾选一个识别字段。&#x27;;
          return;
        }
        let applied = 0;
        checked.forEach((checkbox) =&gt; {
          const row = ocrMergedRows[Number(checkbox.dataset.ocrRow)];
          const target = row &amp;&amp; OCR_TARGETS[row.field];
          if (!target) return;
          const input = byId(target.input);
          const value = row.field === &#x27;fusion_strength&#x27; ? Math.min(360, Math.max(0, Number(row.value))) : Number(row.value);
          input.value = Number.isInteger(value) ? String(value) : String(Number(value.toFixed(4)));
          applied += 1;
        });
        markDirty();
        scheduleDraftSave();
        byId(&#x27;cdc-ocr-status&#x27;).textContent = `已将 ${applied} 个确认字段填入当前面板。`;
        byId(&#x27;cdc-ocr-dialog&#x27;).close();
      }

      function clearOcrResults() {
        ocrCaptures = [];
        ocrMergedRows = [];
        byId(&#x27;cdc-ocr-preview&#x27;).hidden = true;
        byId(&#x27;cdc-ocr-preview&#x27;).removeAttribute(&#x27;src&#x27;);
        byId(&#x27;cdc-ocr-files&#x27;).value = &#x27;&#x27;;
        byId(&#x27;cdc-ocr-status&#x27;).textContent = &#x27;已清除本次截图识别结果。&#x27;;
        renderOcrResults();
      }

      function captureSourceKey(group) {
        return [group.char_id, group.gameplay_effect_name, group.ability_name, group.category, group.name]
          .filter((value) =&gt; value !== null &amp;&amp; value !== undefined &amp;&amp; String(value).trim())
          .join(&#x27;|&#x27;);
      }

      function captureArchiveKey() {
        return `${byId(&#x27;cdc-character&#x27;).value.trim() || &#x27;未命名角色&#x27;}::${byId(&#x27;cdc-version&#x27;).value.trim() || &#x27;未标版本&#x27;}`;
      }

      function readCaptureMappings() {
        try {
          const value = JSON.parse(localStorage.getItem(CAPTURE_MAPPING_STORAGE_KEY) || &#x27;{}&#x27;);
          return value &amp;&amp; typeof value === &#x27;object&#x27; ? value : {};
        } catch (_error) {
          return {};
        }
      }

      function mappedCaptureTarget(group) {
        const mappings = readCaptureMappings();
        return mappings[captureArchiveKey()]?.[captureSourceKey(group)]?.target || &#x27;&#x27;;
      }

      function saveCaptureTarget(group, target) {
        const mappings = readCaptureMappings();
        const archive = captureArchiveKey();
        if (!mappings[archive]) mappings[archive] = {};
        if (target) {
          mappings[archive][captureSourceKey(group)] = {
            target,
            sourceName: group.name || &#x27;&#x27;,
            updatedAt: new Date().toISOString()
          };
        } else {
          delete mappings[archive][captureSourceKey(group)];
        }
        try {
          localStorage.setItem(CAPTURE_MAPPING_STORAGE_KEY, JSON.stringify(mappings));
        } catch (_error) {
          byId(&#x27;cdc-capture-diagnostics&#x27;).textContent = &#x27;事件映射无法写入本机存储。&#x27;;
        }
      }

      function inferredCaptureTarget(group) {
        const text = [group.name, group.category, group.ability_name, group.gameplay_effect_name]
          .filter(Boolean).join(&#x27; &#x27;).toLowerCase();
        if (text.includes(&#x27;浊燃&#x27;) || text.includes(&#x27;reaction_5&#x27;) || String(group.category || &#x27;&#x27;).toLowerCase() === &#x27;scorch&#x27;) return &#x27;model:turbid&#x27;;
        if (text.includes(&#x27;创生花&#x27;) || text.includes(&#x27;创生&#x27;) || text.includes(&#x27;creation blossom&#x27;)
          || text.includes(&#x27;reaction_1&#x27;) || text.includes(&#x27;reaction1_&#x27;)) return &#x27;model:creation&#x27;;
        const exact = Array.from(root.querySelectorAll(&#x27;[data-skill-row]&#x27;)).find((row) =&gt; {
          const name = row.querySelector(&#x27;[data-skill-name]&#x27;).value.trim().toLowerCase();
          return name &amp;&amp; name === String(group.name || &#x27;&#x27;).trim().toLowerCase();
        });
        return exact ? `skill:${exact.dataset.skillId}` : &#x27;new:skill&#x27;;
      }

      function captureTargetOptions(group) {
        const skills = Array.from(root.querySelectorAll(&#x27;[data-skill-row]&#x27;));
        return [
          &#x27;&lt;option value=&quot;new:skill&quot;&gt;新建常规技能&lt;/option&gt;&#x27;,
          &#x27;&lt;option value=&quot;model:creation&quot;&gt;创生花&lt;/option&gt;&#x27;,
          &#x27;&lt;option value=&quot;model:turbid&quot;&gt;浊燃&lt;/option&gt;&#x27;,
          &#x27;&lt;option value=&quot;model:darkstar&quot;&gt;黯星&lt;/option&gt;&#x27;,
          ...skills.map((row, index) =&gt; {
            const name = row.querySelector(&#x27;[data-skill-name]&#x27;).value.trim() || `伤害技能${index + 1}`;
            return `&lt;option value=&quot;skill:${escapeHtml(row.dataset.skillId)}&quot;&gt;现有 · ${escapeHtml(name)}&lt;/option&gt;`;
          })
        ].join(&#x27;&#x27;);
      }

      function formatCaptureTime(unixMs) {
        const date = new Date(Number(unixMs) || Date.now());
        const base = date.toLocaleTimeString(&#x27;zh-CN&#x27;, { hour12: false, minute: &#x27;2-digit&#x27;, second: &#x27;2-digit&#x27; });
        return `${base}.${String(date.getMilliseconds()).padStart(3, &#x27;0&#x27;)}`;
      }

      function coreAuditQuery() {
        return byId(&#x27;cdc-raw-event-character&#x27;).value.trim().toLowerCase();
      }

      function coreAuditRecordText(record) {
        return JSON.stringify([
          record.method || &#x27;&#x27;,
          ...(record.schema || []),
          ...(record.identifiers || []),
          ...(record.samples || []).map((sample) =&gt; `${sample.path || &#x27;&#x27;}=${String(sample.value ?? &#x27;&#x27;)}`)
        ]).toLowerCase();
      }

      function isCoreControlRecord(record) {
        const method = String(record.method || &#x27;&#x27;).toLowerCase();
        return method === &#x27;event.capture.status&#x27; || method.startsWith(&#x27;event.core.&#x27;);
      }

      function filteredCoreAuditRecords() {
        const query = coreAuditQuery();
        const showSummary = byId(&#x27;cdc-core-audit-show-summary&#x27;).checked;
        return captureCoreAudit.filter((record) =&gt; {
          if (!showSummary &amp;&amp; String(record.method || &#x27;&#x27;).toLowerCase() === &#x27;event.battle.summary&#x27;) return false;
          return isCoreControlRecord(record) || !query || coreAuditRecordText(record).includes(query);
        });
      }

      function renderCoreAudit() {
        const preview = byId(&#x27;cdc-core-audit-preview&#x27;);
        const rows = filteredCoreAuditRecords();
        const query = coreAuditQuery();
        const contentRecords = captureCoreAudit.filter((record) =&gt; !isCoreControlRecord(record));
        const matchingContent = query
          ? contentRecords.filter((record) =&gt; coreAuditRecordText(record).includes(query))
          : contentRecords;
        const controlCount = captureCoreAudit.length - contentRecords.length;
        byId(&#x27;cdc-core-audit-count&#x27;).textContent = `${rows.length} / ${captureCoreAudit.length} 条`;
        const diagnostic = byId(&#x27;cdc-core-audit-diagnostic&#x27;);
        if (!captureCoreAudit.length) {
          diagnostic.textContent = &#x27;尚未收到 Core 通知。原始数据包中的 GA、GE、Default__Buff 等英文名称请在上方“原始事件预览”查看。&#x27;;
        } else if (!matchingContent.length) {
          diagnostic.textContent = `Core 已上报 ${controlCount} 条运行状态，但没有上报${query ? `包含“${query}”的` : &#x27;&#x27;}内容通知；这不代表 PCAP 中没有对应字符串。`;
        } else {
          diagnostic.textContent = `Core 内容通知命中 ${matchingContent.length} 条，另有 ${controlCount} 条运行状态；下方仅审计 Core 主动上报的数据。`;
        }
        const file = byId(&#x27;cdc-core-audit-file&#x27;);
        if (captureCoreAuditPath) {
          const name = captureCoreAuditPath.split(/[\\/]/).pop();
          file.textContent = `已保存 ${name} · 沿用上方角色关键词${query ? `“${query}”` : &#x27;（未筛选）&#x27;}`;
          file.title = captureCoreAuditPath;
        } else {
          file.textContent = `开始抓包后自动保存精简审计日志 · 沿用上方角色关键词${query ? `“${query}”` : &#x27;（未筛选）&#x27;}`;
          file.removeAttribute(&#x27;title&#x27;);
        }
        if (!rows.length) {
          preview.innerHTML = `&lt;div class=&quot;entry-row text-small result-meta&quot;&gt;${captureCoreAudit.length &amp;&amp; query ? `现有通知中没有包含“${escapeHtml(query)}”的记录。可清空角色关键词查看全部方法名。` : &#x27;等待 core 发出通知；战斗摘要默认隐藏。&#x27;}&lt;/div&gt;`;
          return;
        }
        preview.innerHTML = rows.slice(-200).reverse().map((record) =&gt; {
          const identifiers = (record.identifiers || [])
            .filter((value) =&gt; isCoreControlRecord(record) || !query || String(value).toLowerCase().includes(query))
            .slice(0, 6);
          const chips = identifiers.length
            ? identifiers.map((value) =&gt; `&lt;span class=&quot;core-audit-chip&quot; title=&quot;${escapeHtml(value)}&quot;&gt;${escapeHtml(value)}&lt;/span&gt;`).join(&#x27;&#x27;)
            : &#x27;&lt;span class=&quot;text-small result-meta&quot;&gt;无匹配字符串标识&lt;/span&gt;&#x27;;
          const schema = (record.schema || []).slice(0, 80).join(&#x27;\n&#x27;) || &#x27;没有参数结构&#x27;;
          const samples = (record.samples || []).slice(0, 60).map((sample) =&gt; {
            const value = typeof sample.value === &#x27;string&#x27; ? sample.value : JSON.stringify(sample.value);
            return `${sample.path || &#x27;(root)&#x27;} = ${value}`;
          }).join(&#x27;\n&#x27;) || &#x27;没有标量样本&#x27;;
          return `&lt;details class=&quot;core-audit-row&quot;&gt;
            &lt;summary&gt;
              &lt;span class=&quot;numeric text-small&quot;&gt;${escapeHtml(formatCaptureTime(record.observed_at_unix_ms))}&lt;/span&gt;
              &lt;span class=&quot;core-audit-method&quot; title=&quot;${escapeHtml(record.method || &#x27;&#x27;)}&quot;&gt;${escapeHtml(record.method || &#x27;(未命名通知)&#x27;)}&lt;/span&gt;
              &lt;span class=&quot;core-audit-identifiers&quot;&gt;${chips}&lt;/span&gt;
            &lt;/summary&gt;
            &lt;div class=&quot;core-audit-detail&quot;&gt;
              &lt;pre&gt;&lt;strong&gt;参数结构&lt;/strong&gt;\n${escapeHtml(schema)}&lt;/pre&gt;
              &lt;pre&gt;&lt;strong&gt;标量样本&lt;/strong&gt;\n${escapeHtml(samples)}&lt;/pre&gt;
            &lt;/div&gt;
          &lt;/details&gt;`;
        }).join(&#x27;&#x27;);
      }

      function ingestCoreAudit(result) {
        (result.audit_records || []).forEach((record) =&gt; captureCoreAudit.push(record));
        if (captureCoreAudit.length &gt; 1000) captureCoreAudit = captureCoreAudit.slice(-1000);
        if (result.audit_path) captureCoreAuditPath = result.audit_path;
        if ((result.audit_records || []).length || result.audit_path) renderCoreAudit();
      }

      function rawCharacterQuery() {
        return byId(&#x27;cdc-raw-event-character&#x27;).value.trim().toLowerCase()
          .replace(/^ga_/, &#x27;&#x27;).replace(/[_*]+$/, &#x27;&#x27;);
      }

      function rawEventMatchesCharacter(event, query = rawCharacterQuery()) {
        if (!query) return true;
        const name = String(event?.name || &#x27;&#x27;).toLowerCase();
        return name.startsWith(`ga_${query}_`) || name.includes(query);
      }

      function associatedRawGaEvent(event, query = rawCharacterQuery()) {
        if (!event || !query) return null;
        if (rawEventMatchesCharacter(event, query) &amp;&amp; String(event.name || &#x27;&#x27;).toLowerCase().startsWith(&#x27;ga_&#x27;)) return event;
        const eventAt = Number(event.observed_at_unix_ms) || 0;
        let nearest = null;
        let nearestDistance = Infinity;
        captureRawEvents.forEach((candidate) =&gt; {
          if (!rawEventMatchesCharacter(candidate, query) || !String(candidate.name || &#x27;&#x27;).toLowerCase().startsWith(&#x27;ga_&#x27;)) return;
          const distance = Math.abs((Number(candidate.observed_at_unix_ms) || 0) - eventAt);
          if (distance &lt; nearestDistance) {
            nearest = candidate;
            nearestDistance = distance;
          }
        });
        return nearestDistance &lt;= 600 ? nearest : null;
      }

      function renderRawEventPreview() {
        const preview = byId(&#x27;cdc-raw-event-preview&#x27;);
        const targetSelect = byId(&#x27;cdc-raw-event-target&#x27;);
        const previousTarget = targetSelect.value;
        targetSelect.innerHTML = captureTargetOptions({});
        if (Array.from(targetSelect.options).some((option) =&gt; option.value === previousTarget)) targetSelect.value = previousTarget;
        if (!captureRawEvents.some((event) =&gt; event.id === captureRawSelectedId)) captureRawSelectedId = &#x27;&#x27;;
        const observed = Number(byId(&#x27;cdc-raw-event-damage&#x27;).value);
        const hasObserved = Number.isFinite(observed) &amp;&amp; observed &gt; 0;
        const characterQuery = rawCharacterQuery();
        const showSystem = byId(&#x27;cdc-show-system-events&#x27;).checked;
        let rows = captureRawEvents
          .filter((event) =&gt; showSystem || event.category !== &#x27;system&#x27;)
          .map((event) =&gt; ({ event, linkedGa: associatedRawGaEvent(event, characterQuery) }))
          .filter(({ event, linkedGa }) =&gt; !characterQuery || rawEventMatchesCharacter(event, characterQuery) || (event.category === &#x27;carrier&#x27; &amp;&amp; linkedGa))
          .map(({ event, linkedGa }) =&gt; {
            const matches = (event.candidates || [])
              .map((value) =&gt; ({ value: Number(value), error: Math.abs(Number(value) - observed) }))
              .filter((candidate) =&gt; Number.isFinite(candidate.value) &amp;&amp; (!hasObserved || candidate.error &lt;= REPORT_ERROR_LIMIT))
              .sort((left, right) =&gt; left.error - right.error);
            return { event, linkedGa, matches, score: matches[0]?.error ?? Infinity };
          });
        if (hasObserved) rows = rows.filter((row) =&gt; row.score &lt;= REPORT_ERROR_LIMIT).sort((a, b) =&gt; a.score - b.score || b.event.observed_at_unix_ms - a.event.observed_at_unix_ms);
        else rows.reverse();
        byId(&#x27;cdc-raw-event-count&#x27;).textContent = `${rows.length} / ${captureRawEvents.length} 条${captureRawSelectedId ? &#x27; · 已选 1&#x27; : &#x27;&#x27;}`;
        if (!rows.length) {
          preview.innerHTML = `&lt;div class=&quot;entry-row text-small result-meta&quot;&gt;${hasObserved ? `没有发现与 ${escapeHtml(format(observed))} 相差 ±${REPORT_ERROR_LIMIT} 的事件候选；可清空数值查看全部事件名。` : &#x27;尚未发现可读事件名；请开始抓包并在游戏内进行一次动作。&#x27;}&lt;/div&gt;`;
          return;
        }
        preview.innerHTML = rows.slice(0, 200).map(({ event, linkedGa, matches }) =&gt; {
          const category = { action: &#x27;动作&#x27;, effect: &#x27;效果&#x27;, carrier: &#x27;载体&#x27;, system: &#x27;系统&#x27; }[event.category] || &#x27;未知&#x27;;
          const direction = event.direction === &#x27;C2S&#x27; ? &#x27;发送&#x27; : &#x27;接收&#x27;;
          const candidates = hasObserved
            ? matches.slice(0, 5).map((candidate) =&gt; `&lt;span class=&quot;raw-event-candidate is-match&quot; title=&quot;与实测相差 ${escapeHtml(format(candidate.error))}&quot;&gt;${escapeHtml(format(candidate.value))}&lt;/span&gt;`).join(&#x27;&#x27;)
            : &#x27;&lt;span class=&quot;text-small result-meta&quot;&gt;输入实测值后筛选&lt;/span&gt;&#x27;;
          return `&lt;div class=&quot;raw-event-row&quot; data-category=&quot;${escapeHtml(event.category || &#x27;system&#x27;)}&quot;&gt;
            &lt;label class=&quot;form-check raw-event-select&quot; title=&quot;选择这一次事件记录作为伤害证据&quot;&gt;&lt;input class=&quot;form-check-input&quot; data-raw-event-selected=&quot;${escapeHtml(event.id)}&quot; name=&quot;cdc-raw-event-source&quot; type=&quot;radio&quot; ${event.id === captureRawSelectedId ? &#x27;checked&#x27; : &#x27;&#x27;} ${hasObserved ? &#x27;&#x27; : &#x27;disabled&#x27;}&gt;&lt;span class=&quot;sr-only&quot;&gt;选择 ${escapeHtml(event.name)}&lt;/span&gt;&lt;/label&gt;
            &lt;span class=&quot;numeric text-small&quot;&gt;${escapeHtml(formatCaptureTime(event.observed_at_unix_ms))}&lt;/span&gt;
            &lt;span class=&quot;raw-event-direction&quot; data-direction=&quot;${escapeHtml(event.direction || &#x27;&#x27;)}&quot;&gt;${direction}&lt;/span&gt;
            &lt;span class=&quot;raw-event-name&quot; title=&quot;${escapeHtml(event.name)}&quot;&gt;${escapeHtml(event.name)}${event.category === &#x27;carrier&#x27; &amp;&amp; linkedGa ? `&lt;span class=&quot;raw-event-link&quot;&gt;↳ ${escapeHtml(linkedGa.name)}&lt;/span&gt;` : &#x27;&#x27;}&lt;/span&gt;
            &lt;span class=&quot;raw-event-kind&quot; title=&quot;英文名称在 UDP 载荷中跨字节出现时，需要按此 bit 位移重组后读取；这不是字段长度。&quot;&gt;${category} · 位移 ${escapeHtml(event.bit_shift ?? 0)} bit · 包长 ${escapeHtml(event.packet_size ?? 0)} B&lt;/span&gt;
            &lt;span class=&quot;raw-event-candidates&quot;&gt;${candidates}&lt;/span&gt;
            &lt;button class=&quot;btn btn-ghost raw-event-copy&quot; data-copy-raw-event=&quot;${escapeHtml(event.name)}&quot; type=&quot;button&quot; title=&quot;复制事件名称&quot;&gt;⧉&lt;/button&gt;
          &lt;/div&gt;`;
        }).join(&#x27;&#x27;);
      }

      function renderCaptureTimeline() {
        const timeline = byId(&#x27;cdc-capture-timeline&#x27;);
        if (!captureGroups.length) {
          timeline.innerHTML = &#x27;&lt;div class=&quot;text-small result-meta&quot;&gt;开始抓包后，新的伤害增量会显示在这里。&lt;/div&gt;&#x27;;
          return;
        }
        timeline.innerHTML = captureGroups.slice().reverse().map((group) =&gt; {
          const savedTarget = mappedCaptureTarget(group);
          const target = savedTarget || inferredCaptureTarget(group);
          const ids = [group.ability_name, group.gameplay_effect_name].filter(Boolean).join(&#x27; · &#x27;) || &#x27;尚无 GA / GE 名称&#x27;;
          const source = [group.marker, group.name || group.category].filter(Boolean).join(&#x27; · &#x27;);
          return `&lt;div class=&quot;capture-event&quot; data-capture-event=&quot;${escapeHtml(group.id)}&quot;&gt;
            &lt;label class=&quot;form-check&quot; title=&quot;采用这一条单段伤害&quot;&gt;
              &lt;input class=&quot;form-check-input&quot; data-capture-selected type=&quot;checkbox&quot; ${group.single_hit ? &#x27;checked&#x27; : &#x27;disabled&#x27;}&gt;
              &lt;span class=&quot;numeric text-small&quot;&gt;${escapeHtml(formatCaptureTime(group.observed_at_unix_ms))}&lt;/span&gt;
            &lt;/label&gt;
            &lt;div class=&quot;capture-source&quot; title=&quot;${escapeHtml(source)}&quot;&gt;&lt;strong&gt;${escapeHtml(source)}&lt;/strong&gt;&lt;div class=&quot;text-small result-meta&quot;&gt;${escapeHtml(group.category || &#x27;未知类别&#x27;)}&lt;/div&gt;&lt;/div&gt;
            &lt;div class=&quot;capture-ids&quot; title=&quot;${escapeHtml(ids)}&quot;&gt;${escapeHtml(ids)}&lt;/div&gt;
            &lt;div class=&quot;capture-value&quot;&gt;${escapeHtml(format(group.damage))}&lt;/div&gt;
            &lt;span class=&quot;capture-hit-badge${group.single_hit ? &#x27;&#x27; : &#x27; is-multihit&#x27;}&quot;&gt;${group.single_hit ? &#x27;1 HIT&#x27; : `${group.hits} HIT 合计`}&lt;/span&gt;
            &lt;label class=&quot;capture-map&quot;&gt;&lt;span class=&quot;sr-only&quot;&gt;映射到&lt;/span&gt;&lt;select class=&quot;form-select&quot; data-capture-target&gt;${captureTargetOptions(group)}&lt;/select&gt;&lt;/label&gt;
          &lt;/div&gt;`;
        }).join(&#x27;&#x27;);
        Array.from(timeline.querySelectorAll(&#x27;[data-capture-event]&#x27;)).forEach((row) =&gt; {
          const group = captureGroups.find((item) =&gt; item.id === row.dataset.captureEvent);
          if (!group) return;
          row.querySelector(&#x27;[data-capture-target]&#x27;).value = mappedCaptureTarget(group) || inferredCaptureTarget(group);
        });
      }

      function setPacketCaptureState(state, message = &#x27;&#x27;) {
        packetCaptureState = state || &#x27;idle&#x27;;
        const status = byId(&#x27;cdc-capture-status&#x27;);
        status.dataset.state = packetCaptureState;
        status.textContent = message || ({ idle: &#x27;尚未启动&#x27;, starting: &#x27;正在启动&#x27;, capturing: &#x27;正在抓包&#x27;, stopped: &#x27;已停止&#x27;, disconnected: &#x27;连接已中断&#x27; }[packetCaptureState] || packetCaptureState);
        byId(&#x27;cdc-start-capture&#x27;).disabled = [&#x27;starting&#x27;, &#x27;capturing&#x27;].includes(packetCaptureState);
        byId(&#x27;cdc-stop-capture&#x27;).disabled = packetCaptureState !== &#x27;capturing&#x27;;
      }

      async function discoverPacketCaptureSidecar() {
        const input = byId(&#x27;cdc-capture-sidecar&#x27;);
        if (input.value.trim()) return;
        const remembered = localStorage.getItem(CAPTURE_SIDECAR_STORAGE_KEY) || &#x27;&#x27;;
        if (remembered) {
          input.value = remembered;
          return;
        }
        try {
          const result = await callDesktopApi(&#x27;find_packet_capture_sidecars&#x27;);
          if (result.ok &amp;&amp; result.paths?.length) input.value = result.paths[0];
        } catch (_error) {
          // The input remains available for a manual path.
        }
      }

      async function choosePacketCaptureSidecar() {
        const result = await callDesktopApi(&#x27;choose_packet_capture_sidecar&#x27;);
        if (!result.ok) throw new Error(result.error || &#x27;没有选择解析核心。&#x27;);
        if (result.path) {
          byId(&#x27;cdc-capture-sidecar&#x27;).value = result.path;
          localStorage.setItem(CAPTURE_SIDECAR_STORAGE_KEY, result.path);
        }
      }

      async function pollPacketCapture() {
        if (packetCaptureState !== &#x27;capturing&#x27;) return;
        try {
          const result = await callDesktopApi(&#x27;poll_packet_capture&#x27;);
          if (!result.ok) throw new Error(result.error || &#x27;读取抓包事件失败。&#x27;);
          (result.groups || []).forEach((group) =&gt; {
            const withinMarkerWindow = captureMarker
              &amp;&amp; Number(group.observed_at_unix_ms) &gt;= captureMarker.at
              &amp;&amp; Number(group.observed_at_unix_ms) - captureMarker.at &lt;= 12000;
            captureGroups.push({ ...group, marker: withinMarkerWindow ? captureMarker.name : &#x27;&#x27; });
          });
          (result.raw_events || []).forEach((event) =&gt; captureRawEvents.push(event));
          ingestCoreAudit(result);
          if (captureGroups.length &gt; 300) captureGroups = captureGroups.slice(-300);
          if (captureRawEvents.length &gt; 500) captureRawEvents = captureRawEvents.slice(-500);
          if ((result.groups || []).length) renderCaptureTimeline();
          if ((result.raw_events || []).length) renderRawEventPreview();
          if ((result.errors || []).length) byId(&#x27;cdc-capture-diagnostics&#x27;).textContent = (result.errors || []).slice(-2).join(&#x27; · &#x27;);
          if (result.state &amp;&amp; result.state !== &#x27;capturing&#x27;) {
            setPacketCaptureState(result.state);
            clearInterval(capturePollTimer);
            capturePollTimer = null;
          }
        } catch (error) {
          setPacketCaptureState(&#x27;disconnected&#x27;, error.message);
          clearInterval(capturePollTimer);
          capturePollTimer = null;
        }
      }

      async function startPacketCapture() {
        const path = byId(&#x27;cdc-capture-sidecar&#x27;).value.trim();
        if (!path) {
          setPacketCaptureState(&#x27;idle&#x27;, &#x27;请先选择 nte-core.exe&#x27;);
          return;
        }
        setPacketCaptureState(&#x27;starting&#x27;);
        byId(&#x27;cdc-capture-diagnostics&#x27;).textContent = &#x27;&#x27;;
        localStorage.setItem(CAPTURE_SIDECAR_STORAGE_KEY, path);
        try {
          captureRawEvents = [];
          captureRawSelectedId = &#x27;&#x27;;
          captureCoreAudit = [];
          captureCoreAuditPath = &#x27;&#x27;;
          renderRawEventPreview();
          renderCoreAudit();
          const result = await callDesktopApi(&#x27;start_packet_capture&#x27;, path);
          if (!result.ok) throw new Error(result.error || &#x27;抓包启动失败。&#x27;);
          ingestCoreAudit(result);
          setPacketCaptureState(&#x27;capturing&#x27;, `正在抓包${result.core_version ? ` · core ${result.core_version}` : &#x27;&#x27;}`);
          if (capturePollTimer) clearInterval(capturePollTimer);
          capturePollTimer = setInterval(pollPacketCapture, 600);
          pollPacketCapture();
        } catch (error) {
          setPacketCaptureState(&#x27;stopped&#x27;, error.message);
        }
      }

      async function stopPacketCapture() {
        byId(&#x27;cdc-stop-capture&#x27;).disabled = true;
        try {
          const result = await callDesktopApi(&#x27;stop_packet_capture&#x27;);
          (result.raw_events || []).forEach((event) =&gt; captureRawEvents.push(event));
          ingestCoreAudit(result);
          if (captureRawEvents.length &gt; 500) captureRawEvents = captureRawEvents.slice(-500);
          if ((result.raw_events || []).length) renderRawEventPreview();
          setPacketCaptureState(result.ok ? (result.state || &#x27;stopped&#x27;) : &#x27;disconnected&#x27;, result.warning || result.error || &#x27;已停止&#x27;);
        } catch (error) {
          setPacketCaptureState(&#x27;disconnected&#x27;, error.message);
        } finally {
          if (capturePollTimer) clearInterval(capturePollTimer);
          capturePollTimer = null;
        }
      }

      function markCaptureAction() {
        const name = byId(&#x27;cdc-capture-marker&#x27;).value.trim() || `动作 ${new Date().toLocaleTimeString(&#x27;zh-CN&#x27;, { hour12: false })}`;
        captureMarker = { name, at: Date.now() };
        byId(&#x27;cdc-capture-marker-status&#x27;).textContent = `已标记“${name}”；接下来 12 秒内出现的事件会归到该动作。`;
      }

      function selectedCaptureGroups() {
        return Array.from(byId(&#x27;cdc-capture-timeline&#x27;).querySelectorAll(&#x27;[data-capture-event]&#x27;))
          .filter((row) =&gt; row.querySelector(&#x27;[data-capture-selected]&#x27;)?.checked)
          .map((row) =&gt; ({
            row,
            group: captureGroups.find((item) =&gt; item.id === row.dataset.captureEvent),
            target: row.querySelector(&#x27;[data-capture-target]&#x27;).value
          }))
          .filter((item) =&gt; item.group?.single_hit);
      }

      function rawEventAsCaptureGroup(event, observed) {
        const name = String(event?.name || &#x27;原始事件&#x27;);
        const lowered = name.toLowerCase();
        const linkedGa = associatedRawGaEvent(event);
        return {
          id: `raw-import-${event.id}`,
          observed_at_unix_ms: event.observed_at_unix_ms,
          char_id: &#x27;&#x27;,
          name,
          category: event.category === &#x27;carrier&#x27; ? &#x27;伤害载体&#x27; : `原始${event.category || &#x27;事件&#x27;}`,
          ability_name: lowered.startsWith(&#x27;ga_&#x27;) ? name : linkedGa?.name || &#x27;&#x27;,
          gameplay_effect_name: lowered.startsWith(&#x27;ge_&#x27;) ? name : &#x27;&#x27;,
          hits: 1,
          damage: Math.round(observed),
          single_hit: true,
          marker: captureMarker?.name || &#x27;&#x27;
        };
      }

      function selectedRawCaptureGroups() {
        const observed = Number(byId(&#x27;cdc-raw-event-damage&#x27;).value);
        const event = captureRawEvents.find((item) =&gt; item.id === captureRawSelectedId);
        if (!event || !Number.isFinite(observed) || observed &lt;= 0) return [];
        return [{
          group: rawEventAsCaptureGroup(event, observed),
          target: byId(&#x27;cdc-raw-event-target&#x27;).value || &#x27;new:skill&#x27;,
          raw: true
        }];
      }

      function appendCapturedSkill(group, target, usedRows) {
        const observed = Math.round(Number(group.damage) || 0);
        let targetRow = target.startsWith(&#x27;skill:&#x27;)
          ? Array.from(root.querySelectorAll(&#x27;[data-skill-row]&#x27;)).find((row) =&gt; row.dataset.skillId === target.slice(6))
          : null;
        const model = target === &#x27;model:creation&#x27; ? &#x27;creation&#x27;
          : target === &#x27;model:turbid&#x27; ? &#x27;turbid&#x27;
            : target === &#x27;model:darkstar&#x27; ? &#x27;darkstar&#x27; : &#x27;skill&#x27;;
        if (!targetRow &amp;&amp; model !== &#x27;skill&#x27;) {
          targetRow = Array.from(root.querySelectorAll(&#x27;[data-skill-row]&#x27;)).find((row) =&gt; row.querySelector(&#x27;[data-skill-model]&#x27;).value === model);
        }
        if (targetRow &amp;&amp; !usedRows.has(targetRow)) {
          targetRow.querySelector(&#x27;[data-skill-observed]&#x27;).value = String(observed);
          targetRow.querySelector(&#x27;[data-skill-enabled]&#x27;).checked = true;
          usedRows.add(targetRow);
          return;
        }
        if (targetRow) {
          const name = targetRow.querySelector(&#x27;[data-skill-name]&#x27;).value || group.name;
          const multiplier = Number(targetRow.querySelector(&#x27;[data-skill-multiplier]&#x27;).value) || 0;
          const tag = skillTagForRow(targetRow);
          addSkill(`${name} · 抓包`, targetRow.querySelector(&#x27;[data-skill-model]&#x27;).value, multiplier, observed, false, true, tag);
          return;
        }
        addSkill(group.marker || group.name || &#x27;抓包伤害&#x27;, model, 0, observed, false, true, model === &#x27;turbid&#x27; ? &#x27;dot&#x27; : &#x27;direct&#x27;);
      }

      function importCapturedNormal() {
        const rawSelected = selectedRawCaptureGroups();
        const selected = [...selectedCaptureGroups(), ...rawSelected];
        if (!selected.length) {
          byId(&#x27;cdc-capture-diagnostics&#x27;).textContent = &#x27;请选择一条已匹配实测伤害的原始记录，或勾选可直接采用的 1 Hit 摘要。&#x27;;
          return;
        }
        calculatorType = &#x27;damage&#x27;;
        workspaceMode = &#x27;damage&#x27;;
        verificationMode = &#x27;normal&#x27;;
        const usedRows = new Set();
        selected.forEach(({ group, target }) =&gt; appendCapturedSkill(group, target, usedRows));
        rawSelected.forEach(({ group, target }) =&gt; saveCaptureTarget(group, target));
        updateCalculatorType();
        updateSkillPagination(true);
        markDirty();
        scheduleDraftSave();
        captureRawSelectedId = &#x27;&#x27;;
        renderRawEventPreview();
        byId(&#x27;cdc-capture-diagnostics&#x27;).textContent = `已写入 ${selected.length} 条伤害证据；请在技能区人工确认倍率和“暴击”。`;
      }

      function importCapturedRage() {
        const rawSelected = selectedRawCaptureGroups();
        const selected = [...selectedCaptureGroups(), ...rawSelected];
        if (!selected.length) {
          byId(&#x27;cdc-capture-diagnostics&#x27;).textContent = &#x27;请选择一条已匹配实测伤害的原始记录，或勾选可用于溯源的 1 Hit 摘要。&#x27;;
          return;
        }
        calculatorType = &#x27;damage&#x27;;
        workspaceMode = &#x27;damage&#x27;;
        verificationMode = &#x27;rage&#x27;;
        const existing = readRageValues();
        const incoming = selected.map(({ group }) =&gt; Math.round(Number(group.damage) || 0));
        rawSelected.forEach(({ group, target }) =&gt; saveCaptureTarget(group, target));
        byId(&#x27;cdc-rage-values&#x27;).value = [...existing, ...incoming].join(&#x27; &#x27;);
        updateCalculatorType();
        markDirty();
        scheduleDraftSave();
        captureRawSelectedId = &#x27;&#x27;;
        renderRawEventPreview();
        byId(&#x27;cdc-capture-diagnostics&#x27;).textContent = `已将 ${incoming.length} 条伤害证据加入狂暴溯源。`;
      }

      function makeRowId(prefix) {
        if (window.crypto &amp;&amp; typeof window.crypto.randomUUID === &#x27;function&#x27;) {
          return `${prefix}-${window.crypto.randomUUID()}`;
        }
        return `${prefix}-${Date.now().toString(36)}-${rowCounter.toString(36)}`;
      }

      function normalizedScopeMode(value) {
        return [&#x27;all&#x27;, &#x27;dot&#x27;, &#x27;direct&#x27;, &#x27;custom&#x27;].includes(value) ? value : &#x27;all&#x27;;
      }

      function effectScopeSkillIds(row) {
        try {
          const parsed = JSON.parse(row.dataset.scopeSkillIds || &#x27;[]&#x27;);
          return Array.isArray(parsed) ? parsed.map(String) : [];
        } catch (_error) {
          return [];
        }
      }

      function updateEffectScopeSummary(row) {
        const button = row.querySelector(&#x27;[data-edit-effect-scope]&#x27;);
        if (!button) return;
        const mode = normalizedScopeMode(row.dataset.scopeMode);
        if (mode === &#x27;all&#x27;) button.textContent = &#x27;作用：全部技能&#x27;;
        if (mode === &#x27;dot&#x27;) button.textContent = &#x27;作用：持续伤害&#x27;;
        if (mode === &#x27;direct&#x27;) button.textContent = &#x27;作用：非持续伤害&#x27;;
        if (mode !== &#x27;custom&#x27;) return;
        const selected = new Set(effectScopeSkillIds(row));
        const names = Array.from(root.querySelectorAll(&#x27;[data-skill-row]&#x27;))
          .filter((skillRow) =&gt; selected.has(skillRow.dataset.skillId))
          .map((skillRow, index) =&gt; skillRow.querySelector(&#x27;[data-skill-name]&#x27;).value.trim() || `技能${index + 1}`);
        button.textContent = names.length === 0
          ? &#x27;作用：未选择技能&#x27;
          : names.length === 1 ? `作用：${names[0]}` : `作用：${names[0]}等${names.length}项`;
        button.title = names.length ? names.join(&#x27;、&#x27;) : &#x27;当前 Buff 不作用于任何伤害技能&#x27;;
      }

      function updateAllEffectScopeSummaries() {
        root.querySelectorAll(&#x27;[data-effect-row]&#x27;).forEach(updateEffectScopeSummary);
      }

      function renderEffectScopeSkillList(selectedIds = []) {
        const list = byId(&#x27;cdc-effect-scope-skills&#x27;);
        const selected = new Set(selectedIds.map(String));
        const skills = Array.from(root.querySelectorAll(&#x27;[data-skill-row]&#x27;));
        list.innerHTML = skills.length ? skills.map((row, index) =&gt; {
          const name = row.querySelector(&#x27;[data-skill-name]&#x27;).value.trim() || `伤害技能${index + 1}`;
          const tag = skillTagForRow(row) === &#x27;dot&#x27; ? &#x27; · 持续伤害&#x27; : &#x27;&#x27;;
          return `&lt;label class=&quot;form-check scope-skill-option&quot;&gt;
            &lt;input class=&quot;form-check-input&quot; data-scope-skill-id=&quot;${escapeHtml(row.dataset.skillId)}&quot; type=&quot;checkbox&quot; ${selected.has(row.dataset.skillId) ? &#x27;checked&#x27; : &#x27;&#x27;}&gt;
            &lt;span class=&quot;form-check-label&quot;&gt;${escapeHtml(name + tag)}&lt;/span&gt;
          &lt;/label&gt;`;
        }).join(&#x27;&#x27;) : &#x27;&lt;div class=&quot;text-small result-meta&quot;&gt;请先在技能区添加至少一个伤害技能。&lt;/div&gt;&#x27;;
      }

      function openEffectScopeEditor(row) {
        editingEffectScopeRow = row;
        const mode = normalizedScopeMode(row.dataset.scopeMode);
        byId(&#x27;cdc-scope-effect-name&#x27;).textContent = `当前 Buff：${row.querySelector(&#x27;[data-effect-name]&#x27;).value.trim() || &#x27;未命名效果&#x27;}`;
        byId(&#x27;cdc-effect-scope-mode&#x27;).value = mode;
        renderEffectScopeSkillList(effectScopeSkillIds(row));
        byId(&#x27;cdc-effect-scope-skills&#x27;).hidden = mode !== &#x27;custom&#x27;;
        byId(&#x27;cdc-effect-scope-dialog&#x27;).showModal();
      }

      function closeEffectScopeEditor() {
        editingEffectScopeRow = null;
        byId(&#x27;cdc-effect-scope-dialog&#x27;).close();
      }

      function applyEffectScopeEditor() {
        if (!editingEffectScopeRow) return;
        const mode = normalizedScopeMode(byId(&#x27;cdc-effect-scope-mode&#x27;).value);
        const selectedIds = Array.from(byId(&#x27;cdc-effect-scope-skills&#x27;).querySelectorAll(&#x27;[data-scope-skill-id]:checked&#x27;))
          .map((checkbox) =&gt; checkbox.dataset.scopeSkillId);
        editingEffectScopeRow.dataset.scopeMode = mode;
        editingEffectScopeRow.dataset.scopeSkillIds = JSON.stringify(selectedIds);
        updateEffectScopeSummary(editingEffectScopeRow);
        closeEffectScopeEditor();
        markDirty();
        scheduleDraftSave();
      }

      function inclinationScopeContributorIds(row) {
        try {
          const parsed = JSON.parse(row.dataset.inclinationContributorIds || &#x27;[]&#x27;);
          return Array.isArray(parsed) ? parsed.map(String) : [];
        } catch (_error) {
          return [];
        }
      }

      function updateInclinationScopeSummary(row) {
        const button = row.querySelector(&#x27;[data-edit-inclination-scope]&#x27;);
        if (!button) return;
        const mode = row.dataset.inclinationScopeMode === &#x27;custom&#x27; ? &#x27;custom&#x27; : &#x27;all&#x27;;
        if (mode === &#x27;all&#x27;) {
          button.textContent = &#x27;倾陷：全队&#x27;;
          button.title = &#x27;该 Buff 的倾陷相关属性作用于全部启用角色&#x27;;
          return;
        }
        const selected = new Set(inclinationScopeContributorIds(row));
        const names = Array.from(root.querySelectorAll(&#x27;[data-inclination-row]&#x27;))
          .filter((item) =&gt; selected.has(item.dataset.inclinationId))
          .map((item, index) =&gt; item.querySelector(&#x27;[data-inclination-name]&#x27;).value.trim() || `角色${index + 1}`);
        button.textContent = names.length ? `倾陷：${names[0]}${names.length &gt; 1 ? `等${names.length}人` : &#x27;&#x27;}` : &#x27;倾陷：未选角色&#x27;;
        button.title = names.length ? names.join(&#x27;、&#x27;) : &#x27;该 Buff 不作用于任何倾陷贡献角色&#x27;;
      }

      function updateAllInclinationScopeSummaries() {
        root.querySelectorAll(&#x27;[data-effect-row]&#x27;).forEach(updateInclinationScopeSummary);
      }

      function renderInclinationScopeContributorList(selectedIds = []) {
        const selected = new Set(selectedIds.map(String));
        const rows = Array.from(root.querySelectorAll(&#x27;[data-inclination-row]&#x27;));
        byId(&#x27;cdc-inclination-scope-contributors&#x27;).innerHTML = rows.length ? rows.map((row, index) =&gt; {
          const name = row.querySelector(&#x27;[data-inclination-name]&#x27;).value.trim() || `角色${index + 1}`;
          return `&lt;label class=&quot;form-check scope-skill-option&quot;&gt;&lt;input class=&quot;form-check-input&quot; data-inclination-scope-id=&quot;${escapeHtml(row.dataset.inclinationId)}&quot; type=&quot;checkbox&quot; ${selected.has(row.dataset.inclinationId) ? &#x27;checked&#x27; : &#x27;&#x27;}&gt;&lt;span class=&quot;form-check-label&quot;&gt;${escapeHtml(name)}&lt;/span&gt;&lt;/label&gt;`;
        }).join(&#x27;&#x27;) : &#x27;&lt;div class=&quot;text-small result-meta&quot;&gt;请先添加倾陷贡献角色。&lt;/div&gt;&#x27;;
      }

      function openInclinationScopeEditor(row) {
        editingInclinationScopeRow = row;
        const mode = row.dataset.inclinationScopeMode === &#x27;custom&#x27; ? &#x27;custom&#x27; : &#x27;all&#x27;;
        byId(&#x27;cdc-inclination-scope-effect-name&#x27;).textContent = `当前 Buff：${row.querySelector(&#x27;[data-effect-name]&#x27;).value.trim() || &#x27;未命名效果&#x27;}`;
        byId(&#x27;cdc-inclination-scope-mode&#x27;).value = mode;
        renderInclinationScopeContributorList(inclinationScopeContributorIds(row));
        byId(&#x27;cdc-inclination-scope-contributors&#x27;).hidden = mode !== &#x27;custom&#x27;;
        byId(&#x27;cdc-inclination-scope-dialog&#x27;).showModal();
      }

      function closeInclinationScopeEditor() {
        editingInclinationScopeRow = null;
        byId(&#x27;cdc-inclination-scope-dialog&#x27;).close();
      }

      function applyInclinationScopeEditor() {
        if (!editingInclinationScopeRow) return;
        const mode = byId(&#x27;cdc-inclination-scope-mode&#x27;).value === &#x27;custom&#x27; ? &#x27;custom&#x27; : &#x27;all&#x27;;
        const ids = Array.from(byId(&#x27;cdc-inclination-scope-contributors&#x27;).querySelectorAll(&#x27;[data-inclination-scope-id]:checked&#x27;))
          .map((checkbox) =&gt; checkbox.dataset.inclinationScopeId);
        editingInclinationScopeRow.dataset.inclinationScopeMode = mode;
        editingInclinationScopeRow.dataset.inclinationContributorIds = JSON.stringify(ids);
        updateInclinationScopeSummary(editingInclinationScopeRow);
        closeInclinationScopeEditor();
        markDirty();
        scheduleDraftSave();
      }

      function boundedStackValue(value, fallback = 1, minimum = 0) {
        const parsed = Math.trunc(Number(value));
        return Number.isFinite(parsed) ? Math.max(minimum, Math.min(30, parsed)) : fallback;
      }

      function updateEffectStackFields(row) {
        const enabled = row.querySelector(&#x27;[data-effect-stack-enabled]&#x27;).checked;
        const mode = row.querySelector(&#x27;[data-effect-stack-mode]&#x27;).value === &#x27;fixed&#x27; ? &#x27;fixed&#x27; : &#x27;auto&#x27;;
        const settings = row.querySelector(&#x27;[data-effect-stack-settings]&#x27;);
        const fixedField = row.querySelector(&#x27;[data-effect-fixed-stacks-field]&#x27;);
        const maxInput = row.querySelector(&#x27;[data-effect-max-stacks]&#x27;);
        const fixedInput = row.querySelector(&#x27;[data-effect-fixed-stacks]&#x27;);
        settings.hidden = !enabled;
        fixedField.hidden = !enabled || mode !== &#x27;fixed&#x27;;
        const maxStacks = boundedStackValue(maxInput.value, 6, 1);
        maxInput.value = String(maxStacks);
        fixedInput.max = String(maxStacks);
        const minimumFixed = row.dataset.searchState === &#x27;locked&#x27; &amp;&amp; mode === &#x27;fixed&#x27; ? 1 : 0;
        fixedInput.min = String(minimumFixed);
        fixedInput.value = String(Math.max(minimumFixed, Math.min(maxStacks, boundedStackValue(fixedInput.value, maxStacks, 0))));
      }

      function normalizedEffectSearchState(value) {
        return [&#x27;locked&#x27;, &#x27;suspended&#x27;].includes(value) ? value : &#x27;auto&#x27;;
      }

      function updateEffectSearchState(row) {
        const select = row.querySelector(&#x27;[data-effect-search-state]&#x27;);
        const state = normalizedEffectSearchState(select?.value || row.dataset.searchState);
        row.dataset.searchState = state;
        if (select) select.value = state;
        const priority = row.querySelector(&#x27;[data-effect-priority]&#x27;);
        if (priority) {
          priority.disabled = state !== &#x27;auto&#x27;;
          priority.closest(&#x27;.effect-priority&#x27;).title = state === &#x27;auto&#x27;
            ? &#x27;同等误差时，更优先保留该 Buff 生效&#x27;
            : state === &#x27;locked&#x27; ? &#x27;锁定状态已经强制该 Buff 生效&#x27; : &#x27;挂起状态不会读取该 Buff&#x27;;
        }
        updateEffectStackFields(row);
      }

      function addEffect(name = &#x27;&#x27;, values = {}) {
        if (root.querySelectorAll(&#x27;[data-effect-row]&#x27;).length &gt;= 12) return;
        rowCounter += 1;
        const row = document.createElement(&#x27;div&#x27;);
        row.className = &#x27;entry-row effect-row&#x27;;
        row.dataset.effectRow = String(rowCounter);
        row.dataset.searchState = normalizedEffectSearchState(values.searchState);
        row.dataset.scopeMode = normalizedScopeMode(values.scopeMode);
        row.dataset.scopeSkillIds = JSON.stringify(Array.isArray(values.scopeSkillIds) ? values.scopeSkillIds : []);
        row.dataset.inclinationScopeMode = values.inclinationScopeMode === &#x27;custom&#x27; ? &#x27;custom&#x27; : &#x27;all&#x27;;
        row.dataset.inclinationContributorIds = JSON.stringify(Array.isArray(values.inclinationContributorIds) ? values.inclinationContributorIds : []);
        row.innerHTML = `
          &lt;div class=&quot;effect-identity&quot;&gt;
            &lt;label class=&quot;form-label&quot;&gt;名称&lt;input class=&quot;form-control&quot; data-effect-name type=&quot;text&quot; value=&quot;${escapeHtml(name)}&quot;&gt;&lt;/label&gt;
            &lt;label class=&quot;form-label effect-search-state&quot;&gt;验算状态&lt;select class=&quot;form-select&quot; data-effect-search-state&gt;&lt;option value=&quot;auto&quot;&gt;参与搜索&lt;/option&gt;&lt;option value=&quot;locked&quot;&gt;锁定生效&lt;/option&gt;&lt;option value=&quot;suspended&quot;&gt;挂起排除&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
            &lt;label class=&quot;form-check effect-priority&quot; title=&quot;同等误差时，更优先保留该 Buff 生效&quot;&gt;
              &lt;input class=&quot;form-check-input&quot; data-effect-priority type=&quot;checkbox&quot; ${values.priority !== false ? &#x27;checked&#x27; : &#x27;&#x27;}&gt;
              &lt;span class=&quot;form-check-label&quot;&gt;高触发优先&lt;/span&gt;
            &lt;/label&gt;
            &lt;label class=&quot;form-check effect-stack-toggle&quot; title=&quot;仅层数型 Buff 开启；开启后下方数值按每层填写&quot;&gt;
              &lt;input class=&quot;form-check-input&quot; data-effect-stack-enabled type=&quot;checkbox&quot; ${values.stackEnabled ? &#x27;checked&#x27; : &#x27;&#x27;}&gt;
              &lt;span class=&quot;form-check-label&quot;&gt;叠层 Buff&lt;/span&gt;
            &lt;/label&gt;
            &lt;button class=&quot;btn effect-scope-button&quot; type=&quot;button&quot; data-edit-effect-scope data-effect-damage-field&gt;作用：全部技能&lt;/button&gt;
            &lt;button class=&quot;btn inclination-scope-button&quot; type=&quot;button&quot; data-edit-inclination-scope data-inclination-only hidden&gt;倾陷：全队&lt;/button&gt;
            &lt;button class=&quot;btn btn-ghost&quot; type=&quot;button&quot; data-remove-effect&gt;删除此效果&lt;/button&gt;
          &lt;/div&gt;
          &lt;div class=&quot;effect-stack-settings&quot; data-effect-stack-settings ${values.stackEnabled ? &#x27;&#x27; : &#x27;hidden&#x27;}&gt;
            &lt;div class=&quot;effect-stack-note&quot;&gt;下方所有非零属性均按“每层数值”填写。自动反推会验算 0～最大层数。&lt;/div&gt;
            &lt;label class=&quot;form-label&quot;&gt;层数方式&lt;select class=&quot;form-select&quot; data-effect-stack-mode&gt;&lt;option value=&quot;auto&quot; ${values.stackMode !== &#x27;fixed&#x27; ? &#x27;selected&#x27; : &#x27;&#x27;}&gt;自动反推&lt;/option&gt;&lt;option value=&quot;fixed&quot; ${values.stackMode === &#x27;fixed&#x27; ? &#x27;selected&#x27; : &#x27;&#x27;}&gt;固定层数&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
            &lt;label class=&quot;form-label&quot;&gt;最大层数&lt;input class=&quot;form-control&quot; data-effect-max-stacks type=&quot;number&quot; min=&quot;1&quot; max=&quot;30&quot; step=&quot;1&quot; value=&quot;${boundedStackValue(values.maxStacks, 6, 1)}&quot;&gt;&lt;/label&gt;
            &lt;label class=&quot;form-label&quot; data-effect-fixed-stacks-field ${values.stackMode === &#x27;fixed&#x27; ? &#x27;&#x27; : &#x27;hidden&#x27;}&gt;当前层数&lt;input class=&quot;form-control&quot; data-effect-fixed-stacks type=&quot;number&quot; min=&quot;0&quot; max=&quot;30&quot; step=&quot;1&quot; value=&quot;${boundedStackValue(values.fixedStacks, values.maxStacks || 6, 0)}&quot;&gt;&lt;/label&gt;
          &lt;/div&gt;
          &lt;div class=&quot;effect-values&quot;&gt;
            &lt;label class=&quot;form-label&quot;&gt;攻击加成（%）&lt;input class=&quot;form-control&quot; data-effect-attack type=&quot;number&quot; step=&quot;0.01&quot; value=&quot;${values.attack || 0}&quot;&gt;&lt;/label&gt;
            &lt;label class=&quot;form-label&quot; data-effect-damage-field&gt;防御穿透（%）&lt;input class=&quot;form-control&quot; data-effect-penetration type=&quot;number&quot; step=&quot;0.01&quot; value=&quot;${values.penetration || 0}&quot;&gt;&lt;/label&gt;

            &lt;label class=&quot;form-label&quot; data-effect-damage-field&gt;暴击伤害（%）&lt;input class=&quot;form-control&quot; data-effect-crit type=&quot;number&quot; step=&quot;0.01&quot; value=&quot;${values.crit || 0}&quot;&gt;&lt;/label&gt;
            &lt;label class=&quot;form-label&quot; data-effect-damage-field&gt;技能倍率（%）&lt;input class=&quot;form-control&quot; data-effect-skill type=&quot;number&quot; step=&quot;0.01&quot; value=&quot;${values.skill || 0}&quot;&gt;&lt;/label&gt;

            &lt;label class=&quot;form-label&quot; data-effect-heal-field hidden&gt;治疗加成（%）&lt;input class=&quot;form-control&quot; data-effect-heal-bonus type=&quot;number&quot; step=&quot;0.01&quot; value=&quot;${values.healBonus ?? values.heal ?? 0}&quot;&gt;&lt;/label&gt;
          &lt;/div&gt;`;
        byId(&#x27;cdc-effects&#x27;).appendChild(row);

      function addSkill(name = &#x27;&#x27;, model = &#x27;skill&#x27;, multiplier = 0, observed = 0, critical = false, enabled = true, tag = &#x27;direct&#x27;, id = &#x27;&#x27;) {

          &lt;label class=&quot;form-label&quot; data-skill-tag-field&gt;伤害 Tag&lt;select class=&quot;form-select&quot; data-skill-tag&gt;&lt;option value=&quot;direct&quot;&gt;非持续&lt;/option&gt;&lt;option value=&quot;dot&quot;&gt;持续伤害&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
          &lt;label class=&quot;form-label&quot; data-skill-multiplier-field&gt;基础倍率（%）&lt;input class=&quot;form-control&quot; data-skill-multiplier type=&quot;number&quot; min=&quot;0&quot; step=&quot;0.01&quot; value=&quot;${multiplier}&quot;&gt;&lt;/label&gt;
          &lt;label class=&quot;form-label&quot; data-normal-skill-field&gt;实测显示伤害&lt;input class=&quot;form-control&quot; data-skill-observed type=&quot;number&quot; min=&quot;0&quot; step=&quot;1&quot; value=&quot;${observed}&quot;&gt;&lt;/label&gt;
          &lt;div class=&quot;skill-options&quot;&gt;
            &lt;label class=&quot;form-check&quot; data-normal-skill-field data-skill-critical-field&gt;&lt;input class=&quot;form-check-input&quot; data-skill-critical type=&quot;checkbox&quot; ${critical ? &#x27;checked&#x27; : &#x27;&#x27;}&gt;&lt;span class=&quot;form-check-label&quot;&gt;暴击&lt;/span&gt;&lt;/label&gt;
