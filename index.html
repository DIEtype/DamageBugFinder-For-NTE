        fusionFlat: &#x27;环合强度固定提升&#x27;, healBonus: &#x27;治疗加成&#x27;
      };

      function inclinationScopeApplies(effect, contributor) {
        return effect.inclinationScopeMode !== &#x27;custom&#x27;
          || (effect.inclinationContributorIds || []).includes(String(contributor.id));
      }

      function componentAffectsDamageTarget(component, effect, target, contributors = []) {
        if (target.model === &#x27;inclination&#x27;) {
          return [&#x27;penetration&#x27;, &#x27;resShred&#x27;, &#x27;inclinationDamage&#x27;].includes(component)
            &amp;&amp; contributors.some((contributor) =&gt; contributor.enabled &amp;&amp; inclinationScopeApplies(effect, contributor));
        }
        if (!scopeAppliesToSkill(effect, target)) return false;
        const canCrit = verificationMode === &#x27;rage&#x27; || target.critical;
        if (target.model === &#x27;skill&#x27;) {
          if ([&#x27;attack&#x27;, &#x27;penetration&#x27;, &#x27;resShred&#x27;, &#x27;damage&#x27;, &#x27;skill&#x27;].includes(component)) return true;
          if (component === &#x27;crit&#x27;) return canCrit;
          if (component === &#x27;dotDamage&#x27;) return target.tag === &#x27;dot&#x27;;
          if ([&#x27;fusionPercent&#x27;, &#x27;fusionFlat&#x27;].includes(component)) return specialEffect !== &#x27;none&#x27;;
          return false;
        }
        if (component === &#x27;resShred&#x27;) return true;
        if (component === &#x27;penetration&#x27;) return target.model !== &#x27;darkstar&#x27;;
        if (component === &#x27;crit&#x27;) return canCrit;
        if ([&#x27;fusionPercent&#x27;, &#x27;fusionFlat&#x27;].includes(component)) return true;
        if (component === &#x27;dotDamage&#x27;) return target.model === &#x27;turbid&#x27;;
        if (component === &#x27;damage&#x27;) return effect.scopeMode === &#x27;custom&#x27;;
        return false;
      }

      function relevantEffectComponents(effect, skills, heals, contributors = []) {
        if (effect.searchState === &#x27;suspended&#x27;) return [];
        if (calculatorType === &#x27;heal&#x27;) {
          return heals.some((heal) =&gt; heal.enabled) ? [&#x27;attack&#x27;, &#x27;healBonus&#x27;] : [];
        }
        const targets = skills.filter((skill) =&gt; skill.enabled);
        return [&#x27;attack&#x27;, &#x27;penetration&#x27;, &#x27;resShred&#x27;, &#x27;damage&#x27;, &#x27;dotDamage&#x27;, &#x27;inclinationDamage&#x27;, &#x27;crit&#x27;, &#x27;skill&#x27;, &#x27;fusionPercent&#x27;, &#x27;fusionFlat&#x27;]
          .filter((component) =&gt; effect[component] &amp;&amp; targets.some((target) =&gt; componentAffectsDamageTarget(component, effect, target, contributors)));
      }

      function baseAtomAffectsTargets(atom, effects, skills, heals) {
        if (calculatorType === &#x27;heal&#x27;) {
          if (!heals.some((heal) =&gt; heal.enabled)) return false;
          if (atom.id === &#x27;base-attack&#x27;) return percent(&#x27;cdc-atk-bonus&#x27;) !== 0;
          if (atom.id === &#x27;base-heal-bonus&#x27;) return percent(&#x27;cdc-heal-bonus&#x27;) !== 0;
          return atom.id === &#x27;zone-heal-bonus&#x27;;
        }
        const targets = skills.filter((skill) =&gt; skill.enabled);
        const normalTargets = targets.filter((target) =&gt; target.model === &#x27;skill&#x27;);
        const defenseTargets = targets.filter((target) =&gt; [&#x27;skill&#x27;, &#x27;creation&#x27;, &#x27;turbid&#x27;, &#x27;inclination&#x27;].includes(target.model));
        const panelPenetrationTargets = targets.filter((target) =&gt; [&#x27;skill&#x27;, &#x27;creation&#x27;, &#x27;turbid&#x27;].includes(target.model));
        const reactionTargets = targets.filter((target) =&gt; [&#x27;creation&#x27;, &#x27;turbid&#x27;, &#x27;darkstar&#x27;].includes(target.model));
        const canCrit = verificationMode === &#x27;rage&#x27; ? targets.length &gt; 0 : targets.some((target) =&gt; target.critical);
        const fusionUsed = reactionTargets.length &gt; 0 || (specialEffect !== &#x27;none&#x27; &amp;&amp; normalTargets.length &gt; 0);
        const explicitReactionDamage = effects.some((effect) =&gt; effect.searchState !== &#x27;suspended&#x27;
          &amp;&amp; effect.damage
          &amp;&amp; reactionTargets.some((target) =&gt; componentAffectsDamageTarget(&#x27;damage&#x27;, effect, target)));
        if (atom.id === &#x27;base-attack&#x27;) return normalTargets.length &gt; 0 &amp;&amp; percent(&#x27;cdc-atk-bonus&#x27;) !== 0;
        if (atom.id === &#x27;base-penetration&#x27;) return panelPenetrationTargets.length &gt; 0 &amp;&amp; percent(&#x27;cdc-penetration&#x27;) !== 0;
        if (atom.id === &#x27;base-res-shred&#x27;) return targets.some((target) =&gt; target.model !== &#x27;inclination&#x27;) &amp;&amp; percent(&#x27;cdc-res-shred&#x27;) !== 0;
        if (atom.id === &#x27;base-general&#x27;) return normalTargets.length &gt; 0 &amp;&amp; percent(&#x27;cdc-general&#x27;) !== 0;
        if (atom.id === &#x27;base-elemental&#x27;) return normalTargets.length &gt; 0 &amp;&amp; percent(&#x27;cdc-elemental&#x27;) !== 0;
        if (atom.id === &#x27;base-extra&#x27;) return normalTargets.length &gt; 0 &amp;&amp; percent(&#x27;cdc-extra&#x27;) !== 0;
        if (atom.id === &#x27;base-crit&#x27;) return canCrit &amp;&amp; percent(&#x27;cdc-crit&#x27;) !== 0;
        if (atom.id === &#x27;zone-defense&#x27;) return defenseTargets.length &gt; 0;
        if (atom.id === &#x27;zone-resistance&#x27;) return targets.length &gt; 0;
        if (atom.id === &#x27;zone-damage&#x27;) return normalTargets.length &gt; 0 || explicitReactionDamage;
        if (atom.id === &#x27;zone-crit&#x27;) return canCrit;
        if (atom.id === &#x27;zone-skill&#x27;) return normalTargets.length &gt; 0;
        if (atom.id === &#x27;base-fusion&#x27;) return fusionUsed &amp;&amp; number(&#x27;cdc-fusion&#x27;) !== 0;
        if (atom.id === &#x27;zone-fusion&#x27;) return fusionUsed;
        if (atom.id === &#x27;base-special&#x27;) return specialEffect !== &#x27;none&#x27; &amp;&amp; normalTargets.length &gt; 0;
        return false;
      }

      function createAtoms(effects, skills, heals, contributors = []) {
        const fusionNeeded = needsFusionStrength();
        const atoms = baseAtoms
          .filter((atom) =&gt; atom.modes.includes(calculatorType))
          .filter((atom) =&gt; atom.conditional !== &#x27;fusion&#x27; || fusionNeeded)
          .filter((atom) =&gt; atom.conditional !== &#x27;special&#x27; || specialEffect !== &#x27;none&#x27;)
          .filter((atom) =&gt; baseAtomAffectsTargets(atom, effects, skills, heals))
          .map((atom) =&gt; ({ ...atom, expected: true, kind: &#x27;base&#x27; }));
        effects.forEach((effect, effectIndex) =&gt; {
          const components = relevantEffectComponents(effect, skills, heals, contributors);
          if (!components.length) return;
          const common = {
            expected: true,
            effectIndex,
            effectName: effect.name,
            searchState: effect.searchState,
            priorityWeight: effect.priority ? 2 : 1,
            scopeMode: normalizedScopeMode(effect.scopeMode),
            scopeSkillIds: Array.isArray(effect.scopeSkillIds) ? effect.scopeSkillIds.map(String) : [],
            inclinationScopeMode: effect.inclinationScopeMode === &#x27;custom&#x27; ? &#x27;custom&#x27; : &#x27;all&#x27;,
            inclinationContributorIds: Array.isArray(effect.inclinationContributorIds) ? effect.inclinationContributorIds.map(String) : [],
            skillMultiply: effect.skillMultiply
          };
          if (effect.stackEnabled) {
            const values = {};
            components.forEach((component) =&gt; { values[component] = effect[component]; });
            if (!Object.keys(values).length) return;
            const maxStacks = boundedStackValue(effect.maxStacks, 6, 1);
            if (effect.stackMode === &#x27;fixed&#x27;) {
              const fixedStacks = Math.min(maxStacks, boundedStackValue(effect.fixedStacks, 0, 0));
              if (fixedStacks &gt; 0) atoms.push({
                ...common,
                id: `effect-${effectIndex}-stack-fixed`,
                kind: &#x27;stack-fixed&#x27;,
                values,
                stackCount: fixedStacks,
                stackMax: maxStacks
              });
              return;
            }
            for (let layer = 1; layer &lt;= maxStacks; layer += 1) {
              atoms.push({
                ...common,
                id: `effect-${effectIndex}-stack-${layer}`,
                kind: &#x27;stack&#x27;,
                values,
                stackLayer: layer,
                stackCount: 1,
                stackMax: maxStacks
              });
            }
            return;
          }
          components.forEach((component) =&gt; {
            atoms.push({
              ...common,
              id: `effect-${effectIndex}-${component}`,
              kind: &#x27;effect&#x27;,
              component,
              value: effect[component],
              skillMultiply: component === &#x27;skill&#x27; &amp;&amp; effect.skillMultiply
            });
          });
        });
        return atoms;
      }

      function isStackAtom(atom) {
        return atom.kind === &#x27;stack&#x27; || atom.kind === &#x27;stack-fixed&#x27;;
      }

      function effectAtomEntries(atom) {
        if (!isStackAtom(atom)) return [[atom.component, atom.value]];
        const scale = atom.stackCount || 1;
        return Object.entries(atom.values).map(([component, value]) =&gt; [component, value * scale]);
      }

      function finalizeState(state) {
        const enabled = (id) =&gt; state.active.has(id);
        state.combatAttack = number(&#x27;cdc-panel&#x27;) + number(&#x27;cdc-base&#x27;) * state.attackBonus;
        state.fusionStrength = state.fusionBase * (1 + state.fusionPercent) + state.fusionFlat;
        const characterFactor = 100 + number(&#x27;cdc-char-level&#x27;);
        const enemyFactor = (100 + number(&#x27;cdc-enemy-level&#x27;)) * (1 - state.penetration);
        const calculatedDefense = characterFactor / (characterFactor + enemyFactor);
        const calculatedResistance = 1 - percent(&#x27;cdc-resistance&#x27;) + state.resShred;
        state.defenseZone = enabled(&#x27;zone-defense&#x27;) ? calculatedDefense : 1;
        state.resistanceZone = enabled(&#x27;zone-resistance&#x27;) ? calculatedResistance : 1;
        state.damageZoneEnabled = enabled(&#x27;zone-damage&#x27;);
        state.damageZone = enabled(&#x27;zone-damage&#x27;) ? 1 + state.damageBonus : 1;
        state.dotDamageZone = 1 + state.dotDamageBonus;
        state.critZoneEnabled = enabled(&#x27;zone-crit&#x27;);
        state.skillZoneEnabled = enabled(&#x27;zone-skill&#x27;);
        state.healBonusZone = enabled(&#x27;zone-heal-bonus&#x27;) ? 1 + state.healBonus : 1;
        state.creationFusionZone = enabled(&#x27;zone-fusion&#x27;) ? 1 + state.fusionStrength / formulaSettings.fusionDivisor : 1;
        state.specialZone = specialEffect !== &#x27;none&#x27; &amp;&amp; enabled(&#x27;base-special&#x27;) &amp;&amp; enabled(&#x27;zone-fusion&#x27;)
          ? 1 + formulaSettings.specialBaseBonus + state.fusionStrength / formulaSettings.specialFusionDivisor
          : 1;
        return state;
      }

      function buildState(activeIds, atoms) {
        const active = activeIds instanceof Set ? activeIds : new Set(activeIds);
        const enabled = (id) =&gt; active.has(id);
        const state = {
          attackBonus: enabled(&#x27;base-attack&#x27;) ? percent(&#x27;cdc-atk-bonus&#x27;) : 0,
          penetration: enabled(&#x27;base-penetration&#x27;) ? percent(&#x27;cdc-penetration&#x27;) : 0,
          resShred: enabled(&#x27;base-res-shred&#x27;) ? percent(&#x27;cdc-res-shred&#x27;) : 0,
          damageBonus: (enabled(&#x27;base-general&#x27;) ? percent(&#x27;cdc-general&#x27;) : 0)
            + (enabled(&#x27;base-elemental&#x27;) ? percent(&#x27;cdc-elemental&#x27;) : 0)
            + (enabled(&#x27;base-extra&#x27;) ? percent(&#x27;cdc-extra&#x27;) : 0),
          dotDamageBonus: 0,
          // The game panel shows bonus critical damage. The actual critical
          // multiplier always includes the implicit base multiplier of 1.
          critDamage: 1 + (enabled(&#x27;base-crit&#x27;) ? percent(&#x27;cdc-crit&#x27;) : 0),
          skillAdd: 0,
          skillProduct: 1,
          healBonus: enabled(&#x27;base-heal-bonus&#x27;) ? percent(&#x27;cdc-heal-bonus&#x27;) : 0,
          fusionBase: enabled(&#x27;base-fusion&#x27;) ? Math.max(0, Math.min(360, number(&#x27;cdc-fusion&#x27;))) : 0,
          fusionPercent: 0,
          fusionFlat: 0,
          active,
          baseFailures: atoms.filter((atom) =&gt; atom.kind === &#x27;base&#x27; &amp;&amp; !active.has(atom.id)).map((atom) =&gt; atom.label),
          activeEffectAtoms: atoms.filter((atom) =&gt; atom.kind !== &#x27;base&#x27; &amp;&amp; active.has(atom.id)),
          effectStackCounts: {}
        };
        state.activeScopedAtoms = state.activeEffectAtoms.filter((atom) =&gt; atom.scopeMode !== &#x27;all&#x27;);
        const stackSkillMultiplyTotals = {};
        state.activeEffectAtoms.forEach((atom) =&gt; {
          if (isStackAtom(atom)) {
            state.effectStackCounts[atom.effectIndex] = (state.effectStackCounts[atom.effectIndex] || 0) + (atom.stackCount || 1);
          }
          effectAtomEntries(atom).forEach(([component, value]) =&gt; {
            if (component === &#x27;attack&#x27;) state.attackBonus += value;
            if (component === &#x27;penetration&#x27;) state.penetration += value;
            if (component === &#x27;resShred&#x27;) state.resShred += value;
            if (component === &#x27;damage&#x27;) state.damageBonus += value;
            if (component === &#x27;dotDamage&#x27;) state.dotDamageBonus += value;
            if (component === &#x27;crit&#x27;) state.critDamage += value;
            if (component === &#x27;skill&#x27; &amp;&amp; atom.skillMultiply &amp;&amp; isStackAtom(atom)) {
              stackSkillMultiplyTotals[atom.effectIndex] = (stackSkillMultiplyTotals[atom.effectIndex] || 0) + value;
            }
            if (component === &#x27;skill&#x27; &amp;&amp; atom.skillMultiply &amp;&amp; !isStackAtom(atom)) state.skillProduct *= 1 + value;
            if (component === &#x27;skill&#x27; &amp;&amp; !atom.skillMultiply) state.skillAdd += value;
            if (component === &#x27;healBonus&#x27;) state.healBonus += value;
            if (component === &#x27;fusionPercent&#x27;) state.fusionPercent += value;
            if (component === &#x27;fusionFlat&#x27;) state.fusionFlat += value;
          });
        });
        Object.values(stackSkillMultiplyTotals).forEach((value) =&gt; { state.skillProduct *= 1 + value; });
        state.stackSkillMultiplyTotals = stackSkillMultiplyTotals;
        return finalizeState(state);
      }

      function scopeAppliesToSkill(atom, target) {
        if (atom.scopeMode === &#x27;all&#x27;) return true;
        const targetTag = target.model === &#x27;turbid&#x27; ? &#x27;dot&#x27; : target.tag;
        if (atom.scopeMode === &#x27;dot&#x27;) return targetTag === &#x27;dot&#x27;;
        if (atom.scopeMode === &#x27;direct&#x27;) return targetTag !== &#x27;dot&#x27;;
        return atom.scopeSkillIds.includes(String(target.id));
      }

      function stateForSkill(globalState, target) {
        if (target.model === &#x27;inclination&#x27;) return globalState;
        const excluded = globalState.activeScopedAtoms.filter((atom) =&gt; !scopeAppliesToSkill(atom, target));
        let state = globalState;
        if (excluded.length) {
          state = { ...globalState };
          const excludedStackSkillTotals = {};
          excluded.forEach((atom) =&gt; {
            effectAtomEntries(atom).forEach(([component, value]) =&gt; {
              if (component === &#x27;attack&#x27;) state.attackBonus -= value;
              if (component === &#x27;penetration&#x27;) state.penetration -= value;
              if (component === &#x27;resShred&#x27;) state.resShred -= value;
              if (component === &#x27;damage&#x27;) state.damageBonus -= value;
              if (component === &#x27;dotDamage&#x27;) state.dotDamageBonus -= value;
              if (component === &#x27;crit&#x27;) state.critDamage -= value;
              if (component === &#x27;skill&#x27; &amp;&amp; atom.skillMultiply &amp;&amp; isStackAtom(atom)) {
                excludedStackSkillTotals[atom.effectIndex] = (excludedStackSkillTotals[atom.effectIndex] || 0) + value;
              }
              if (component === &#x27;skill&#x27; &amp;&amp; atom.skillMultiply &amp;&amp; !isStackAtom(atom)) state.skillProduct /= 1 + value;
              if (component === &#x27;skill&#x27; &amp;&amp; !atom.skillMultiply) state.skillAdd -= value;
              if (component === &#x27;healBonus&#x27;) state.healBonus -= value;
              if (component === &#x27;fusionPercent&#x27;) state.fusionPercent -= value;
              if (component === &#x27;fusionFlat&#x27;) state.fusionFlat -= value;
            });
          });
          Object.values(excludedStackSkillTotals).forEach((value) =&gt; { state.skillProduct /= 1 + value; });
          state = finalizeState(state);
        }
        if ([&#x27;creation&#x27;, &#x27;turbid&#x27;, &#x27;darkstar&#x27;].includes(target.model)) {
          let explicitDamageBonus = 0;
          globalState.activeEffectAtoms
            .filter((atom) =&gt; atom.scopeMode === &#x27;custom&#x27; &amp;&amp; scopeAppliesToSkill(atom, target))
            .forEach((atom) =&gt; {
              effectAtomEntries(atom).forEach(([component, value]) =&gt; {
                if (component === &#x27;damage&#x27;) explicitDamageBonus += value;
              });
            });
          const appliedExplicitBonus = state.damageZoneEnabled ? explicitDamageBonus : 0;
          state = { ...state, explicitReactionDamageBonus: appliedExplicitBonus, explicitReactionDamageZone: 1 + appliedExplicitBonus };
        }
        return state;
      }

      function priorityPenalty(activeIds, atoms, effects) {
        const active = activeIds instanceof Set ? activeIds : new Set(activeIds);
        return effects.reduce((sum, effect, effectIndex) =&gt; {
          const effectAtoms = atoms.filter((atom) =&gt; atom.kind !== &#x27;base&#x27; &amp;&amp; atom.effectIndex === effectIndex);
          if (!effectAtoms.length) return sum;
          if (effect.stackEnabled) {
            const hasActiveLayer = effectAtoms.some((atom) =&gt; active.has(atom.id));
            return sum + (hasActiveLayer ? 0 : (effect.priority ? 2 : 1));
          }
          const inactiveRatio = effectAtoms.filter((atom) =&gt; !active.has(atom.id)).length / effectAtoms.length;
          return sum + inactiveRatio * (effect.priority ? 2 : 1);
        }, 0);
      }

      function effectFailureCount(activeIds, atoms, effects) {
        const active = activeIds instanceof Set ? activeIds : new Set(activeIds);
        return effects.reduce((sum, effect, effectIndex) =&gt; {
          const effectAtoms = atoms.filter((atom) =&gt; atom.kind !== &#x27;base&#x27; &amp;&amp; atom.effectIndex === effectIndex);
          if (!effectAtoms.length) return sum;
          if (effect.stackEnabled) return sum + Number(!effectAtoms.some((atom) =&gt; active.has(atom.id)));
          return sum + effectAtoms.filter((atom) =&gt; !active.has(atom.id)).length;
        }, 0);
      }

      function describeHypothesis(state, atoms, effects) {
        const effectDescriptions = effects.map((effect, effectIndex) =&gt; {
          if (effect.searchState === &#x27;suspended&#x27;) return &#x27;&#x27;;
          const effectAtoms = atoms.filter((atom) =&gt; atom.kind !== &#x27;base&#x27; &amp;&amp; atom.effectIndex === effectIndex);
          if (!effectAtoms.length) return &#x27;&#x27;;
          if (effect.stackEnabled &amp;&amp; effect.stackMode === &#x27;fixed&#x27; &amp;&amp; boundedStackValue(effect.fixedStacks, 0, 0) === 0) {
            return `${effect.name}固定 0/${boundedStackValue(effect.maxStacks, 6, 1)} 层`;
          }
          if (effect.stackEnabled) {
            const count = state.effectStackCounts[effectIndex] || 0;
            const maximum = boundedStackValue(effect.maxStacks, 6, 1);
            if (!count) return `${effect.name}未生效（0/${maximum} 层）`;
            if (effect.searchState === &#x27;locked&#x27;) return `${effect.name}锁定 ${count}/${maximum} 层生效`;
            return effect.stackMode === &#x27;fixed&#x27;
              ? `${effect.name}固定 ${count}/${maximum} 层生效`
              : `${effect.name}推测 ${count}/${maximum} 层生效`;
          }
          const activeAtoms = effectAtoms.filter((atom) =&gt; state.active.has(atom.id));
          if (!activeAtoms.length) return `${effect.name}未生效`;
          if (effect.searchState === &#x27;locked&#x27;) return `${effect.name}锁定生效`;
          if (activeAtoms.length === effectAtoms.length) return `${effect.name}全部生效`;
          return `${effect.name}仅${activeAtoms.map((atom) =&gt; componentLabels[atom.component]).join(&#x27;、&#x27;)}生效`;
        }).filter(Boolean);
        const baseDescription = state.baseFailures.length
          ? `基础异常：${state.baseFailures.join(&#x27;、&#x27;)}未生效`
          : verificationMode === &#x27;rage&#x27; ? &#x27;基础乘区正常&#x27; : &#x27;基础区锁定（仅验算 Buff）&#x27;;
        return effectDescriptions.concat(baseDescription).join(&#x27;；&#x27;);
      }

      function inclinationPrediction(state, contributors) {
        const enabled = contributors.filter((item) =&gt; item.enabled);
        const capZone = INCLINATION_PRESET.cap / formulaSettings.inclinationCapDivisor;
        const contributions = enabled.map((contributor) =&gt; {
          const totals = { penetration: contributor.penetration, resShred: contributor.resShred, damage: contributor.damage };
          state.activeEffectAtoms.filter((atom) =&gt; inclinationScopeApplies(atom, contributor)).forEach((atom) =&gt; {
            effectAtomEntries(atom).forEach(([component, value]) =&gt; {
              if (component === &#x27;penetration&#x27;) totals.penetration += value;
              if (component === &#x27;resShred&#x27;) totals.resShred += value;
              if (component === &#x27;inclinationDamage&#x27;) totals.damage += value;
            });
          });
          const characterFactor = 100 + contributor.level;
          const enemyFactor = (100 + INCLINATION_PRESET.enemyLevel) * (1 - totals.penetration);
          const defense = state.active.has(&#x27;zone-defense&#x27;) ? characterFactor / (characterFactor + enemyFactor) : 1;
          const resistance = state.active.has(&#x27;zone-resistance&#x27;)
            ? 1 - INCLINATION_PRESET.resistances[contributor.attribute] + totals.resShred
            : 1;
          const bonusZone = 1 + totals.damage;
          const exact = formulaSettings.inclinationBase * bonusZone * capZone * defense * resistance * contributor.special;
          return { contributor, exact, defense, resistance, bonusZone, penetration: totals.penetration, resShred: totals.resShred };
        });
        const exact = contributions.reduce((sum, item) =&gt; sum + item.exact, 0);
        const factors = contributions.map((item, index) =&gt; ({
          kind: &#x27;base&#x27;,
          label: item.contributor.name,
          value: item.exact,
          operator: index ? &#x27;+&#x27; : &#x27;&#x27;,
          note: `${format(formulaSettings.inclinationBase)} × ${format(item.bonusZone)} × ${format(capZone)} × ${format(item.defense)} × ${format(item.resistance)} × ${format(item.contributor.special)}`
        }));
        return { exact, displayed: Math.round(exact), formula: factors, inclinationContributions: contributions };
      }

      function predictSkill(target, source, state, contributors = []) {
        if (target.model === &#x27;inclination&#x27;) return inclinationPrediction(state, contributors);
        const factors = [];
        const push = (kind, label, value, note = &#x27;&#x27;) =&gt; factors.push({ kind, label, value, note });
        if (target.model === &#x27;creation&#x27;) {
          push(&#x27;base&#x27;, &#x27;固定基础&#x27;, formulaSettings.creationBase);
          push(&#x27;defense&#x27;, &#x27;防御区&#x27;, state.defenseZone);
          push(&#x27;resistance&#x27;, &#x27;抗性区&#x27;, state.resistanceZone);
          push(&#x27;fusion&#x27;, &#x27;环合修正&#x27;, state.creationFusionZone, `最终环合强度 ${format(state.fusionStrength)}`);
        } else if (target.model === &#x27;turbid&#x27;) {
          push(&#x27;base&#x27;, &#x27;固定基础&#x27;, formulaSettings.turbidBase);
          push(&#x27;defense&#x27;, &#x27;防御区&#x27;, state.defenseZone);
          push(&#x27;resistance&#x27;, &#x27;抗性区&#x27;, state.resistanceZone);
          push(&#x27;fusion&#x27;, &#x27;环合修正&#x27;, state.creationFusionZone, `最终环合强度 ${format(state.fusionStrength)}`);
          push(&#x27;dot&#x27;, &#x27;持续伤害区&#x27;, state.dotDamageZone);
        } else if (target.model === &#x27;darkstar&#x27;) {
          push(&#x27;base&#x27;, &#x27;固定基础&#x27;, formulaSettings.darkstarBase);
          push(&#x27;defense&#x27;, &#x27;防御区&#x27;, 1, &#x27;黯星无视防御，防御乘区固定为 1&#x27;);
          push(&#x27;resistance&#x27;, &#x27;抗性区&#x27;, state.resistanceZone);
          push(&#x27;fusion&#x27;, &#x27;环合修正&#x27;, state.creationFusionZone, `最终环合强度 ${format(state.fusionStrength)}`);
        } else {
          const calculatedMultiplier = (source.multiplier + state.skillAdd) * state.skillProduct;
          const finalMultiplier = state.skillZoneEnabled ? calculatedMultiplier : 1;
          push(&#x27;attack&#x27;, &#x27;战斗面板攻击&#x27;, state.combatAttack);
          push(&#x27;defense&#x27;, &#x27;防御区&#x27;, state.defenseZone);
          push(&#x27;resistance&#x27;, &#x27;抗性区&#x27;, state.resistanceZone);
          push(&#x27;damage&#x27;, &#x27;增伤区&#x27;, state.damageZone);
          push(&#x27;skill&#x27;, &#x27;技能倍率&#x27;, finalMultiplier);
          if (specialEffect !== &#x27;none&#x27;) {
            const specialName = specialEffect === &#x27;overlay&#x27; ? &#x27;覆纹区&#x27; : &#x27;浸染区&#x27;;
            push(&#x27;independent&#x27;, specialName, state.specialZone, `1 + ${format(formulaSettings.specialBaseBonus * 100)}% + 最终环合强度 ${format(state.fusionStrength)} / ${format(formulaSettings.specialFusionDivisor)}`);
          }
          if (target.tag === &#x27;dot&#x27;) push(&#x27;dot&#x27;, &#x27;持续伤害区&#x27;, state.dotDamageZone);
        }
        if ([&#x27;creation&#x27;, &#x27;turbid&#x27;, &#x27;darkstar&#x27;].includes(target.model)
          &amp;&amp; state.explicitReactionDamageZone !== 1) {
          push(&#x27;damage&#x27;, &#x27;自定义点名增伤&#x27;, state.explicitReactionDamageZone, &#x27;只有作用范围为“自定义技能”并明确勾选该反应的增伤会进入此区&#x27;);
        }
        if (target.critical) push(&#x27;crit&#x27;, &#x27;暴击区&#x27;, state.critZoneEnabled ? state.critDamage : 1);
        const exact = factors.reduce((product, factor) =&gt; product * factor.value, 1);
        return { exact, displayed: Math.round(exact), formula: factors };
      }

      function updateLivePreviews() {
        previewFrame = null;
        try {
          const effects = readEffects();
          const skills = calculatorType === &#x27;damage&#x27; ? readSkills() : [];
          const heals = calculatorType === &#x27;heal&#x27; ? readHeals() : [];
          const contributors = workspaceMode === &#x27;inclination&#x27; ? readInclinationContributors() : [];
          const atoms = createAtoms(effects, skills, heals, contributors);
          const allActive = new Set(atoms.map((atom) =&gt; atom.id));
          const state = buildState(allActive, atoms);
          const skillById = new Map(skills.map((skill) =&gt; [String(skill.id), skill]));
          root.querySelectorAll(&#x27;[data-skill-row]&#x27;).forEach((row) =&gt; {
            const preview = row.querySelector(&#x27;[data-skill-preview]&#x27;);
            if (!preview) return;
            const target = skillById.get(String(row.dataset.skillId));
            if (!target || calculatorType !== &#x27;damage&#x27;) {
              preview.hidden = true;
              return;
            }
            const targetState = stateForSkill(state, target);
            const prediction = predictSkill(target, target, targetState, contributors);
            preview.hidden = false;
            preview.innerHTML = `&lt;span&gt;全部生效 · 自动叠层满层 / 固定层按填写值&lt;/span&gt;&lt;strong&gt;理论 ${escapeHtml(format(prediction.exact))} → 显示 ${prediction.displayed.toLocaleString(&#x27;zh-CN&#x27;)}&lt;/strong&gt;`;
          });
          const healByIndex = new Map(heals.map((heal) =&gt; [heal.index, heal]));
          root.querySelectorAll(&#x27;[data-heal-row]&#x27;).forEach((row, index) =&gt; {
            const preview = row.querySelector(&#x27;[data-heal-preview]&#x27;);
            const heal = healByIndex.get(index);
            if (!preview || !heal || calculatorType !== &#x27;heal&#x27;) {
              if (preview) preview.hidden = true;
              return;
            }
            const exact = state.combatAttack * heal.multiplier * state.healBonusZone;
            preview.hidden = false;
            preview.innerHTML = `&lt;span&gt;全部生效 · 自动叠层满层 / 固定层按填写值&lt;/span&gt;&lt;strong&gt;理论 ${escapeHtml(format(exact))} → 显示 ${Math.round(exact).toLocaleString(&#x27;zh-CN&#x27;)}&lt;/strong&gt;`;
          });
        } catch (_error) {
          root.querySelectorAll(&#x27;[data-skill-preview], [data-heal-preview]&#x27;).forEach((preview) =&gt; {
            preview.hidden = false;
            preview.innerHTML = &#x27;&lt;span&gt;全部生效预览&lt;/span&gt;&lt;strong&gt;等待有效输入&lt;/strong&gt;&#x27;;
          });
        }
      }

      function scheduleLivePreview() {
        if (previewFrame !== null) cancelAnimationFrame(previewFrame);
        previewFrame = requestAnimationFrame(updateLivePreviews);
      }

      function evaluateCombination(activeIds, atoms, effects, skills, heals, contributors = []) {
        const state = buildState(activeIds, atoms);
        const skillStateCache = new Map();
        const getSkillState = (target) =&gt; {
          if (!skillStateCache.has(target.id)) skillStateCache.set(target.id, stateForSkill(state, target));
          return skillStateCache.get(target.id);
        };
        const damageDetails = [];
        const healDetails = [];
        let normalizedScore = 0;
        let totalDisplayError = 0;
        let wrongMultiplierCount = 0;

        skills.filter((skill) =&gt; skill.enabled).forEach((target) =&gt; {
          const targetState = getSkillState(target);
          if ([&#x27;creation&#x27;, &#x27;turbid&#x27;, &#x27;darkstar&#x27;, &#x27;inclination&#x27;].includes(target.model)) {
            const prediction = predictSkill(target, target, targetState, contributors);
            const error = Math.abs(prediction.displayed - target.observed);
            normalizedScore += error / Math.max(1, target.observed);
            totalDisplayError += error;
            damageDetails.push({ target, source: null, ...prediction, error, wrongSource: false });
            return;
          }
          const sourceCandidates = skills.filter((skill) =&gt; skill.model === &#x27;skill&#x27;).map((source) =&gt; {
            const prediction = predictSkill(target, source, targetState);
            const error = Math.abs(prediction.displayed - target.observed);
            return { target, source, ...prediction, error, wrongSource: source.index !== target.index };
          });
          sourceCandidates.sort((a, b) =&gt; a.error - b.error || Number(a.wrongSource) - Number(b.wrongSource));
          const bestSource = sourceCandidates[0];
          normalizedScore += bestSource.error / Math.max(1, target.observed);
          totalDisplayError += bestSource.error;
          if (bestSource.wrongSource) wrongMultiplierCount += 1;
          damageDetails.push(bestSource);
        });

        heals.filter((heal) =&gt; heal.enabled).forEach((heal) =&gt; {
          const formula = [
            { kind: &#x27;attack&#x27;, label: &#x27;战斗面板攻击&#x27;, value: state.combatAttack },
            { kind: &#x27;skill&#x27;, label: &#x27;治疗倍率&#x27;, value: heal.multiplier },
            { kind: &#x27;damage&#x27;, label: &#x27;治疗加成区&#x27;, value: state.healBonusZone }
          ];
          const exact = formula.reduce((product, factor) =&gt; product * factor.value, 1);
          const displayed = Math.round(exact);
          const error = Math.abs(displayed - heal.observed);
          normalizedScore += error / Math.max(1, heal.observed);
          totalDisplayError += error;
          healDetails.push({ heal, exact, displayed, error, formula });
        });

        const itemErrors = damageDetails.map((detail) =&gt; detail.error).concat(healDetails.map((detail) =&gt; detail.error));
        const maxItemError = itemErrors.length ? Math.max(...itemErrors) : 0;
        const overLimitCount = itemErrors.filter((error) =&gt; error &gt; REPORT_ERROR_LIMIT).length;
        return {
          activeIds: new Set(activeIds), state, damageDetails, healDetails, normalizedScore, totalDisplayError,
          wrongMultiplierCount, baseFailureCount: state.baseFailures.length,
          priorityPenalty: priorityPenalty(activeIds, atoms, effects),
          activeEffectCount: state.activeEffectAtoms.length,
          effectFailureCount: effectFailureCount(activeIds, atoms, effects),
          maxItemError, overLimitCount,
          description: describeHypothesis(state, atoms, effects)
        };
      }

      function evaluateRageCombination(activeIds, atoms, effects, skills, rageValues, contributors = []) {
        const state = buildState(activeIds, atoms);
        const skillStateCache = new Map();
        const getSkillState = (target) =&gt; {
          if (!skillStateCache.has(target.id)) skillStateCache.set(target.id, stateForSkill(state, target));
          return skillStateCache.get(target.id);
        };
        const enabledSkills = skills.filter((skill) =&gt; skill.enabled);
        const multiplierSources = enabledSkills.filter((skill) =&gt; skill.model === &#x27;skill&#x27;);
        const sourceCandidates = [];

        enabledSkills.forEach((target) =&gt; {
          const criticalStates = target.model === &#x27;inclination&#x27; ? [false] : [false, true];
          const targetState = getSkillState(target);
          if ([&#x27;creation&#x27;, &#x27;turbid&#x27;, &#x27;darkstar&#x27;, &#x27;inclination&#x27;].includes(target.model)) {
            criticalStates.forEach((critical) =&gt; {
              const testTarget = { ...target, critical };
              const prediction = predictSkill(testTarget, testTarget, targetState, contributors);
              sourceCandidates.push({ target: testTarget, source: null, wrongSource: false, ...prediction });
            });
            return;
          }
          multiplierSources.forEach((source) =&gt; {
            criticalStates.forEach((critical) =&gt; {
              const testTarget = { ...target, critical };
              const prediction = predictSkill(testTarget, source, targetState);
              sourceCandidates.push({
                target: testTarget,
                source,
                wrongSource: source.index !== target.index,
                ...prediction
              });
            });
          });
        });

        const damageDetails = rageValues.map((observed, index) =&gt; {
          let best = null;
          let alternatives = 0;
          sourceCandidates.forEach((candidate) =&gt; {
            const tested = { ...candidate, error: Math.abs(candidate.displayed - observed) };
            if (tested.error &lt;= REPORT_ERROR_LIMIT) alternatives += 1;
            if (!best
              || tested.error &lt; best.error
              || (tested.error === best.error &amp;&amp; Number(tested.wrongSource) &lt; Number(best.wrongSource))
              || (tested.error === best.error &amp;&amp; tested.wrongSource === best.wrongSource
                &amp;&amp; Number(tested.target.critical) &lt; Number(best.target.critical))) {
              best = tested;
            }
          });
          if (!best) {
            return { index, observed, matched: false, error: Number.POSITIVE_INFINITY, alternatives: 0 };
          }
          return {
            index,
            observed,
            matched: best.error &lt;= REPORT_ERROR_LIMIT,
            alternatives,
            ...best
          };
        });

        const finiteErrors = damageDetails.map((detail) =&gt; detail.error).filter(Number.isFinite);
        const totalDisplayError = damageDetails.filter((detail) =&gt; detail.matched)
          .reduce((sum, detail) =&gt; sum + detail.error, 0);
        const normalizedScore = damageDetails.reduce((sum, detail) =&gt; {
          if (!Number.isFinite(detail.error)) return sum + 1;
          return sum + detail.error / Math.max(1, detail.observed);
        }, 0);
        const wrongMultiplierCount = damageDetails.filter((detail) =&gt; detail.matched &amp;&amp; detail.wrongSource).length;
        const maxItemError = finiteErrors.length ? Math.max(...finiteErrors) : Number.POSITIVE_INFINITY;
        const overLimitCount = damageDetails.filter((detail) =&gt; !detail.matched).length;

        return {
          activeIds: new Set(activeIds), state, damageDetails, healDetails: [], normalizedScore, totalDisplayError,
          wrongMultiplierCount, baseFailureCount: state.baseFailures.length,
          priorityPenalty: priorityPenalty(activeIds, atoms, effects),
          activeEffectCount: state.activeEffectAtoms.length,
          effectFailureCount: effectFailureCount(activeIds, atoms, effects),
          maxItemError, overLimitCount,
          description: describeHypothesis(state, atoms, effects),
          rageMode: true
        };
      }

      function compareResults(a, b) {
        return a.overLimitCount - b.overLimitCount
          || a.normalizedScore - b.normalizedScore
          || a.baseFailureCount - b.baseFailureCount
          || a.wrongMultiplierCount - b.wrongMultiplierCount
          || a.priorityPenalty - b.priorityPenalty
          || a.effectFailureCount - b.effectFailureCount;
      }

      function keepRankedResult(results, result, limit) {
        let low = 0;
        let high = results.length;
        while (low &lt; high) {
          const middle = (low + high) &gt;&gt; 1;
          if (compareResults(result, results[middle]) &lt; 0) high = middle;
          else low = middle + 1;
        }
        if (low &gt;= limit) return;
        results.splice(low, 0, result);
        if (results.length &gt; limit) results.pop();
      }

      function buildSearchDimensions(atoms) {
        const dimensions = [];
        const handledStackEffects = new Set();
        atoms.forEach((atom) =&gt; {
          if (atom.kind !== &#x27;stack&#x27;) {
            const forcedActive = (atom.kind === &#x27;base&#x27; &amp;&amp; verificationMode !== &#x27;rage&#x27;) || atom.searchState === &#x27;locked&#x27;;
            dimensions.push({ atomIds: [atom.id], options: forcedActive ? [[atom.id]] : [[], [atom.id]] });
            return;
          }
          if (handledStackEffects.has(atom.effectIndex)) return;
          handledStackEffects.add(atom.effectIndex);
          const layers = atoms
            .filter((candidate) =&gt; candidate.kind === &#x27;stack&#x27; &amp;&amp; candidate.effectIndex === atom.effectIndex)
            .sort((a, b) =&gt; a.stackLayer - b.stackLayer);
          const options = [];
          const minimumCount = layers[0]?.searchState === &#x27;locked&#x27; ? 1 : 0;
          for (let count = minimumCount; count &lt;= layers.length; count += 1) {
            options.push(layers.slice(0, count).map((layer) =&gt; layer.id));
          }
          dimensions.push({ atomIds: layers.map((layer) =&gt; layer.id), options });
        });
        return dimensions;
      }

      function searchHypotheses(atoms, effects, skills, heals, rageValues, contributors = []) {
        const preset = SEARCH_PRESETS[byId(&#x27;cdc-search-strength&#x27;).value] || SEARCH_PRESETS.deep;
        const evaluateState = (activeIds) =&gt; verificationMode === &#x27;rage&#x27;
          ? evaluateRageCombination(activeIds, atoms, effects, skills, rageValues, contributors)
          : evaluateCombination(activeIds, atoms, effects, skills, heals, contributors);
        const dimensions = buildSearchDimensions(atoms);
        const totalStates = dimensions.reduce((total, dimension) =&gt; total * BigInt(dimension.options.length), 1n);
        const totalLabel = totalStates.toLocaleString(&#x27;zh-CN&#x27;);
        const exactThreshold = 2n ** BigInt(preset.exactLimit);
        if (totalStates &lt;= exactThreshold) {
          const results = [];
          const activeIds = new Set();
          let tested = 0;
          const visit = (dimensionIndex) =&gt; {
            if (dimensionIndex &gt;= dimensions.length) {
              tested += 1;
              keepRankedResult(results, evaluateState(activeIds), EXACT_RESULT_KEEP);
              return;
            }
            const dimension = dimensions[dimensionIndex];
            dimension.options.forEach((option) =&gt; {
              option.forEach((id) =&gt; activeIds.add(id));
              visit(dimensionIndex + 1);
              option.forEach((id) =&gt; activeIds.delete(id));
            });
          };
          visit(0);
          return { results, tested, totalLabel, mode: `${preset.label} · 完整枚举（含离散层数）` };
        }

        const width = preset.beamWidth;
        const visited = new Set();
        let beam = [new Set(atoms.filter((atom) =&gt; atom.expected).map((atom) =&gt; atom.id))];
        dimensions.forEach((dimension) =&gt; {
          const candidates = [];
          beam.forEach((previous) =&gt; {
            dimension.options.forEach((option) =&gt; {
              const activeIds = new Set(previous);
              dimension.atomIds.forEach((id) =&gt; activeIds.delete(id));
              option.forEach((id) =&gt; activeIds.add(id));
              visited.add(atoms.map((candidateAtom) =&gt; activeIds.has(candidateAtom.id) ? &#x27;1&#x27; : &#x27;0&#x27;).join(&#x27;&#x27;));
              candidates.push(evaluateState(activeIds));
            });
          });
          candidates.sort(compareResults);
          beam = candidates.slice(0, width).map((result) =&gt; result.activeIds);
        });
        const results = beam.map((activeIds) =&gt; evaluateState(activeIds));
        results.sort(compareResults);
        return { results, tested: visited.size, totalLabel, mode: `${preset.label} · 全生效/满层起点逐项排除 · 限宽 ${width.toLocaleString(&#x27;zh-CN&#x27;)}` };
      }

      function skillModelName(skill) {
        if (skill.model === &#x27;creation&#x27;) return &#x27;创生花伤害&#x27;;
        if (skill.model === &#x27;turbid&#x27;) return &#x27;浊燃伤害&#x27;;
        if (skill.model === &#x27;darkstar&#x27;) return &#x27;黯星伤害&#x27;;
        if (skill.model === &#x27;inclination&#x27;) return &#x27;倾陷伤害（小队合计）&#x27;;
        return skill.name;
      }

      function skillTagMarkup(skill) {
        return skill.model === &#x27;turbid&#x27; || skill.tag === &#x27;dot&#x27;
          ? &#x27; &lt;span class=&quot;damage-tag&quot;&gt;持续伤害&lt;/span&gt;&#x27;
          : &#x27;&#x27;;
      }

      function fixedDamageSource(skill) {
        if (skill.model === &#x27;creation&#x27;) return `固定基础值 ${format(formulaSettings.creationBase)} × 环合强度修正`;
        if (skill.model === &#x27;turbid&#x27;) return `固定基础值 ${format(formulaSettings.turbidBase)} × 环合强度修正 × 持续伤害强化`;
        if (skill.model === &#x27;darkstar&#x27;) return `固定基础值 ${format(formulaSettings.darkstarBase)} × 无视防御 × 环合强度修正`;
        if (skill.model === &#x27;inclination&#x27;) return `Σ（每名角色 ${format(formulaSettings.inclinationBase)} × 倾陷增伤区 × ${format(INCLINATION_PRESET.cap)}/${format(formulaSettings.inclinationCapDivisor)} × 个人防御区 × 个人抗性区 × [1 + 倾陷专属特殊增伤]）`;
        return &#x27;&#x27;;
      }

      function verify() {
        const effects = readEffects();
        const skills = calculatorType === &#x27;damage&#x27; ? readSkills() : [];
        const heals = calculatorType === &#x27;heal&#x27; ? readHeals() : [];
        const contributors = needsInclinationTeam() ? readInclinationContributors() : [];
        const rageValues = readRageValues();
        const observationCount = calculatorType === &#x27;damage&#x27; &amp;&amp; verificationMode === &#x27;rage&#x27;
          ? rageValues.length
          : skills.filter((skill) =&gt; skill.enabled).length + heals.filter((heal) =&gt; heal.enabled).length;
        if (!observationCount) {
          byId(&#x27;cdc-best-combination&#x27;).textContent = verificationMode === &#x27;rage&#x27; ? &#x27;没有未知伤害数据&#x27; : &#x27;没有验算项目&#x27;;
          byId(&#x27;cdc-multiplier-status&#x27;).textContent = &#x27;—&#x27;;
          byId(&#x27;cdc-total-error&#x27;).textContent = &#x27;—&#x27;;
          byId(&#x27;cdc-combination-count&#x27;).textContent = &#x27;—&#x27;;
          byId(&#x27;cdc-tie-count&#x27;).textContent = &#x27;—&#x27;;
          detailRows = [];
          renderDetailPage();
          byId(&#x27;cdc-combination-results&#x27;).innerHTML = &#x27;&#x27;;
          byId(&#x27;cdc-verification-note&#x27;).textContent = verificationMode === &#x27;rage&#x27;
            ? &#x27;请输入至少一个未知来源的实测伤害。&#x27;
            : calculatorType === &#x27;heal&#x27; ? &#x27;请至少选择一项治疗数据。&#x27; : &#x27;请至少选择一项伤害数据。&#x27;;
          return;
        }
        if (verificationMode === &#x27;rage&#x27; &amp;&amp; !skills.some((skill) =&gt; skill.enabled)) {
          byId(&#x27;cdc-best-combination&#x27;).textContent = &#x27;没有候选伤害来源&#x27;;
          byId(&#x27;cdc-verification-note&#x27;).textContent = &#x27;请至少启用一个常规技能、创生花、浊燃、黯星或倾陷伤害模型。&#x27;;
          return;
        }
        if (skills.some((skill) =&gt; skill.enabled &amp;&amp; skill.model === &#x27;inclination&#x27;)
          &amp;&amp; !contributors.some((contributor) =&gt; contributor.enabled)) {
          byId(&#x27;cdc-best-combination&#x27;).textContent = &#x27;倾陷小队为空&#x27;;
          byId(&#x27;cdc-verification-note&#x27;).textContent = &#x27;请在“倾陷小队贡献”中至少启用一名角色。&#x27;;
          return;
        }
        if (contributors.some((contributor) =&gt; contributor.enabled &amp;&amp; contributor.special &lt; 0)) {
          byId(&#x27;cdc-best-combination&#x27;).textContent = &#x27;倾陷角色数据不合法&#x27;;
          byId(&#x27;cdc-verification-note&#x27;).textContent = &#x27;倾陷专属特殊增伤不能低于 -100%。&#x27;;
          return;
        }

        const atoms = createAtoms(effects, skills, heals, contributors);
        const search = searchHypotheses(atoms, effects, skills, heals, rageValues, contributors);
        const results = search.results;
        const eligibleResults = results.filter((result) =&gt; result.overLimitCount === 0);
        if (!eligibleResults.length &amp;&amp; verificationMode !== &#x27;rage&#x27;) {
          byId(&#x27;cdc-best-combination&#x27;).textContent = `没有符合 ±${REPORT_ERROR_LIMIT} 的组合`;
          byId(&#x27;cdc-combination-count&#x27;).textContent = `${search.mode} · 已评估 ${search.tested.toLocaleString(&#x27;zh-CN&#x27;)} / ${search.totalLabel}`;
          byId(&#x27;cdc-multiplier-status&#x27;).textContent = &#x27;—&#x27;;
          byId(&#x27;cdc-total-error&#x27;).textContent = &#x27;—&#x27;;
          byId(&#x27;cdc-tie-count&#x27;).textContent = &#x27;超限结果不汇报&#x27;;
          detailRows = [];
          renderDetailPage();
          byId(&#x27;cdc-combination-results&#x27;).innerHTML = &#x27;&#x27;;
          byId(&#x27;cdc-verification-note&#x27;).textContent = `所有候选状态至少有一项误差超过 ±${REPORT_ERROR_LIMIT}，因此不列出。`;
          return;
        }
        const minimumUnmatched = results[0].overLimitCount;
        const reportableResults = verificationMode === &#x27;rage&#x27;
          ? results.filter((result) =&gt; result.overLimitCount === minimumUnmatched)
          : eligibleResults;
        const best = reportableResults[0];
        const zeroErrorResults = reportableResults.filter((result) =&gt; result.overLimitCount === 0
          &amp;&amp; result.totalDisplayError === 0);
        const top = zeroErrorResults.slice(0, 3);
        const tied = reportableResults.filter((result) =&gt; Math.abs(result.normalizedScore - best.normalizedScore) &lt; 1e-12
          &amp;&amp; result.baseFailureCount === best.baseFailureCount
          &amp;&amp; result.wrongMultiplierCount === best.wrongMultiplierCount
          &amp;&amp; Math.abs(result.priorityPenalty - best.priorityPenalty) &lt; 1e-12
          &amp;&amp; result.effectFailureCount === best.effectFailureCount).length;
        const abnormal = best.damageDetails.filter((detail) =&gt; detail.matched !== false &amp;&amp; detail.wrongSource);

        byId(&#x27;cdc-best-combination&#x27;).textContent = best.description;
        byId(&#x27;cdc-combination-count&#x27;).textContent = `${search.mode} · 已评估 ${search.tested.toLocaleString(&#x27;zh-CN&#x27;)} / ${search.totalLabel}`;
        byId(&#x27;cdc-multiplier-status&#x27;).textContent = abnormal.length ? `${abnormal.length} 项疑似误用` : &#x27;未发现&#x27;;
        byId(&#x27;cdc-total-error&#x27;).textContent = best.totalDisplayError.toLocaleString(&#x27;zh-CN&#x27;);
        byId(&#x27;cdc-tie-count&#x27;).textContent = verificationMode === &#x27;rage&#x27;
          ? `无来源 ${best.overLimitCount} 项 · 同优先级状态 ${tied} 个`
          : `同优先级状态 ${tied} 个`;
        byId(&#x27;cdc-verification-note&#x27;).textContent = verificationMode === &#x27;rage&#x27;
          ? (top.length
            ? `已为 ${best.damageDetails.length - best.overLimitCount}/${best.damageDetails.length} 个伤害找到 ±${REPORT_ERROR_LIMIT} 内来源；右栏只显示整批零误差且无缺失来源的全局状态。`
            : `最佳状态仍有误差或无来源；无零误差备选，右栏不显示近似状态。`)
          : (top.length
            ? &#x27;右栏只显示整批显示值总误差为 0 的全局状态，并按解释优先级排序。&#x27;
            : `最佳状态的显示值总误差为 ${best.totalDisplayError.toLocaleString(&#x27;zh-CN&#x27;)}；无零误差备选，右栏不显示近似状态。`);

        const damageRows = best.damageDetails.map((detail) =&gt; {
          if (verificationMode === &#x27;rage&#x27;) {
            if (!detail.matched) {
              return `&lt;div class=&quot;entry-row&quot;&gt;
                &lt;div&gt;&lt;div class=&quot;text-small text-muted&quot;&gt;实测项目&lt;/div&gt;&lt;div&gt;未知伤害 ${detail.index + 1}&lt;/div&gt;&lt;/div&gt;
                &lt;div&gt;&lt;div class=&quot;text-small text-muted&quot;&gt;可能来源&lt;/div&gt;&lt;div&gt;±${REPORT_ERROR_LIMIT} 内无来源&lt;/div&gt;&lt;/div&gt;
                &lt;div&gt;&lt;div class=&quot;text-small text-muted&quot;&gt;理论值&lt;/div&gt;&lt;div class=&quot;detail-value&quot;&gt;不汇报超限匹配&lt;/div&gt;&lt;/div&gt;
                &lt;div&gt;&lt;div class=&quot;text-small text-muted&quot;&gt;实测值&lt;/div&gt;&lt;div class=&quot;detail-value&quot;&gt;${detail.observed.toLocaleString(&#x27;zh-CN&#x27;)}&lt;/div&gt;&lt;/div&gt;
                &lt;div&gt;&lt;div class=&quot;text-small text-muted&quot;&gt;±20 内来源数&lt;/div&gt;&lt;div class=&quot;detail-value&quot;&gt;0&lt;/div&gt;&lt;/div&gt;
              &lt;/div&gt;`;
            }
            const modelName = skillModelName(detail.target);
            const critName = detail.target.critical ? &#x27;暴击&#x27; : &#x27;非暴击&#x27;;
            const multiplierName = fixedDamageSource(detail.target)
              || (detail.wrongSource ? `倍率疑似来自：${detail.source.name}` : &#x27;本技能倍率&#x27;);
            return `&lt;div class=&quot;entry-row&quot;&gt;
              &lt;div&gt;&lt;div class=&quot;text-small text-muted&quot;&gt;实测项目&lt;/div&gt;&lt;div&gt;未知伤害 ${detail.index + 1} · ${detail.observed.toLocaleString(&#x27;zh-CN&#x27;)}&lt;/div&gt;&lt;/div&gt;
              &lt;div&gt;&lt;div class=&quot;text-small text-muted&quot;&gt;可能来源&lt;/div&gt;&lt;div&gt;${escapeHtml(modelName)}${skillTagMarkup(detail.target)} · ${critName}&lt;/div&gt;&lt;/div&gt;
              &lt;div&gt;&lt;div class=&quot;text-small text-muted&quot;&gt;倍率来源&lt;/div&gt;&lt;div&gt;${escapeHtml(multiplierName)}&lt;/div&gt;&lt;/div&gt;
              &lt;div&gt;&lt;div class=&quot;text-small text-muted&quot;&gt;理论值 → 显示值&lt;/div&gt;&lt;div class=&quot;detail-value&quot;&gt;${format(detail.exact)} → ${detail.displayed.toLocaleString(&#x27;zh-CN&#x27;)}&lt;/div&gt;&lt;/div&gt;
              &lt;div&gt;&lt;div class=&quot;text-small text-muted&quot;&gt;误差 / ±20 内来源数&lt;/div&gt;&lt;div class=&quot;detail-value&quot;&gt;${detail.error} / ${detail.alternatives}&lt;/div&gt;&lt;/div&gt;
              ${formulaTraceMarkup(detail.formula || [])}
            &lt;/div&gt;`;
          }
          const source = fixedDamageSource(detail.target)
            || (detail.wrongSource ? `疑似误用：${detail.source.name}` : &#x27;本技能倍率&#x27;);
          return `&lt;div class=&quot;entry-row&quot;&gt;
            &lt;div&gt;&lt;div class=&quot;text-small text-muted&quot;&gt;实测项目&lt;/div&gt;&lt;div&gt;${escapeHtml(skillModelName(detail.target))}${skillTagMarkup(detail.target)}&lt;/div&gt;&lt;/div&gt;
            &lt;div&gt;&lt;div class=&quot;text-small text-muted&quot;&gt;倍率来源&lt;/div&gt;&lt;div&gt;${escapeHtml(source)}&lt;/div&gt;&lt;/div&gt;
            &lt;div&gt;&lt;div class=&quot;text-small text-muted&quot;&gt;理论精确值 → 显示值&lt;/div&gt;&lt;div class=&quot;detail-value&quot;&gt;${format(detail.exact)} → ${detail.displayed.toLocaleString(&#x27;zh-CN&#x27;)}&lt;/div&gt;&lt;/div&gt;
            &lt;div&gt;&lt;div class=&quot;text-small text-muted&quot;&gt;实测值&lt;/div&gt;&lt;div class=&quot;detail-value&quot;&gt;${detail.target.observed.toLocaleString(&#x27;zh-CN&#x27;)}&lt;/div&gt;&lt;/div&gt;
            &lt;div&gt;&lt;div class=&quot;text-small text-muted&quot;&gt;误差&lt;/div&gt;&lt;div class=&quot;detail-value&quot;&gt;${detail.error.toLocaleString(&#x27;zh-CN&#x27;)}&lt;/div&gt;&lt;/div&gt;
            ${formulaTraceMarkup(detail.formula || [])}
          &lt;/div&gt;`;
        });
        const healRows = verificationMode === &#x27;rage&#x27; ? [] : best.healDetails.map((detail) =&gt; `&lt;div class=&quot;entry-row&quot;&gt;
          &lt;div&gt;&lt;div class=&quot;text-small text-muted&quot;&gt;实测项目&lt;/div&gt;&lt;div&gt;${escapeHtml(detail.heal.name)}&lt;/div&gt;&lt;/div&gt;
          &lt;div&gt;&lt;div class=&quot;text-small text-muted&quot;&gt;倍率来源&lt;/div&gt;&lt;div&gt;本治疗倍率&lt;/div&gt;&lt;/div&gt;
          &lt;div&gt;&lt;div class=&quot;text-small text-muted&quot;&gt;理论精确值 → 显示值&lt;/div&gt;&lt;div class=&quot;detail-value&quot;&gt;${format(detail.exact)} → ${detail.displayed.toLocaleString(&#x27;zh-CN&#x27;)}&lt;/div&gt;&lt;/div&gt;
          &lt;div&gt;&lt;div class=&quot;text-small text-muted&quot;&gt;实测值&lt;/div&gt;&lt;div class=&quot;detail-value&quot;&gt;${detail.heal.observed.toLocaleString(&#x27;zh-CN&#x27;)}&lt;/div&gt;&lt;/div&gt;
          &lt;div&gt;&lt;div class=&quot;text-small text-muted&quot;&gt;误差&lt;/div&gt;&lt;div class=&quot;detail-value&quot;&gt;${detail.error.toLocaleString(&#x27;zh-CN&#x27;)}&lt;/div&gt;&lt;/div&gt;
          ${formulaTraceMarkup(detail.formula || [])}
        &lt;/div&gt;`);
        detailRows = damageRows.concat(healRows);
        renderDetailPage();

        byId(&#x27;cdc-combination-results&#x27;).innerHTML = top.length ? top.map((result) =&gt; `&lt;div class=&quot;entry-row&quot;&gt;
          &lt;div&gt;&lt;div class=&quot;text-small text-muted&quot;&gt;效果与失效状态&lt;/div&gt;&lt;div&gt;${escapeHtml(result.description)}&lt;/div&gt;&lt;/div&gt;
          &lt;div&gt;&lt;div class=&quot;text-small text-muted&quot;&gt;显示值总误差&lt;/div&gt;&lt;div class=&quot;detail-value&quot;&gt;${result.totalDisplayError.toLocaleString(&#x27;zh-CN&#x27;)}&lt;/div&gt;&lt;/div&gt;
          &lt;div&gt;&lt;div class=&quot;text-small text-muted&quot;&gt;无来源 / 倍率误用 / 基础失效 / Buff 优先级违背 / 效果失效&lt;/div&gt;&lt;div class=&quot;detail-value&quot;&gt;${result.overLimitCount} / ${result.wrongMultiplierCount} / ${result.baseFailureCount} / ${format(result.priorityPenalty)} / ${result.effectFailureCount}&lt;/div&gt;&lt;/div&gt;
        &lt;/div&gt;`).join(&#x27;&#x27;) : &#x27;&lt;div class=&quot;text-small result-meta&quot;&gt;无零误差全局状态&lt;/div&gt;&#x27;;
      }

      function markDirty() {
        if (restoring) return;
        byId(&#x27;cdc-run-status&#x27;).textContent = calculatorType === &#x27;heal&#x27;
          ? &#x27;数据已修改，点击“确定并开始治疗验算”&#x27;
          : workspaceMode === &#x27;inclination&#x27; ? &#x27;数据已修改，点击“确定并开始倾陷验算”&#x27;
          : verificationMode === &#x27;rage&#x27; ? &#x27;数据已修改，点击“确定并开始溯源”&#x27; : &#x27;数据已修改，点击“确定并开始验算”&#x27;;
        if (verificationDirty) return;
        verificationDirty = true;
        byId(&#x27;cdc-best-combination&#x27;).textContent = &#x27;等待验算&#x27;;
        byId(&#x27;cdc-combination-count&#x27;).textContent = &#x27;当前结果尚未计算&#x27;;
        byId(&#x27;cdc-multiplier-status&#x27;).textContent = &#x27;—&#x27;;
        byId(&#x27;cdc-total-error&#x27;).textContent = &#x27;—&#x27;;
        byId(&#x27;cdc-tie-count&#x27;).textContent = &#x27;—&#x27;;
        detailRows = [];
        detailPage = 0;
        renderDetailPage();
        byId(&#x27;cdc-combination-results&#x27;).innerHTML = &#x27;&#x27;;
        byId(&#x27;cdc-verification-note&#x27;).textContent = &#x27;完成全部输入后再启动验算。&#x27;;
      }

      function runVerification() {
        const fusionInput = byId(&#x27;cdc-fusion&#x27;);
        const fusionValue = Number(fusionInput.value);
        if (needsFusionStrength() &amp;&amp; (!Number.isFinite(fusionValue) || fusionValue &lt; 0 || fusionValue &gt; 360)) {
          byId(&#x27;cdc-run-status&#x27;).textContent = &#x27;基础环合强度必须在 0～360；Buff 结算后的最终环合强度可以超过 360。&#x27;;
          fusionInput.focus();
          return;
        }
        const button = byId(&#x27;cdc-run-verification&#x27;);
        button.disabled = true;
        byId(&#x27;cdc-run-status&#x27;).textContent = &#x27;正在计算组合，请稍候…&#x27;;
        setTimeout(() =&gt; {
          try {
            verify();
            verificationDirty = false;
            byId(&#x27;cdc-run-status&#x27;).textContent = calculatorType === &#x27;heal&#x27;
              ? &#x27;治疗验算完成&#x27;
              : workspaceMode === &#x27;inclination&#x27; ? &#x27;倾陷验算完成&#x27;
              : verificationMode === &#x27;rage&#x27; ? &#x27;溯源完成&#x27; : &#x27;验算完成&#x27;;
          } catch (error) {
            verificationDirty = true;
            const detail = error &amp;&amp; error.message ? `：${error.message}` : &#x27;&#x27;;
            byId(&#x27;cdc-run-status&#x27;).textContent = (verificationMode === &#x27;rage&#x27; ? &#x27;溯源过程中出现错误&#x27; : &#x27;验算过程中出现错误&#x27;) + detail;
          } finally {
            button.disabled = false;
          }
        }, 20);
      }

      root.addEventListener(&#x27;input&#x27;, (event) =&gt; {
        if (event.target.matches(&#x27;input, select, textarea&#x27;)) {
          if (event.target.matches(&#x27;[data-skill-name]&#x27;)) updateAllEffectScopeSummaries();
          if (event.target.matches(&#x27;[data-inclination-name]&#x27;)) updateAllInclinationScopeSummaries();
          if (event.target.id !== &#x27;cdc-profile-select&#x27;) markDirty();
          scheduleDraftSave();
          scheduleLivePreview();
        }
      });
      root.addEventListener(&#x27;change&#x27;, (event) =&gt; {
        if (event.target.matches(&#x27;input, select, textarea&#x27;)) {
          if (event.target.matches(&#x27;[data-effect-stack-enabled], [data-effect-stack-mode], [data-effect-max-stacks], [data-effect-fixed-stacks]&#x27;)) {
            updateEffectStackFields(event.target.closest(&#x27;[data-effect-row]&#x27;));
          }
          if (event.target.matches(&#x27;[data-effect-search-state]&#x27;)) {
            updateEffectSearchState(event.target.closest(&#x27;[data-effect-row]&#x27;));
          }
          if (event.target.matches(&#x27;[data-skill-model]&#x27;)) {
            workspaceMode = event.target.value === &#x27;inclination&#x27; ? &#x27;inclination&#x27; : &#x27;damage&#x27;;
            calculatorType = &#x27;damage&#x27;;
            updateCalculatorType();
          }
          if (event.target.matches(&#x27;[data-skill-tag]&#x27;)) updateAllEffectScopeSummaries();
          if (event.target.id !== &#x27;cdc-profile-select&#x27;) markDirty();
          scheduleDraftSave();
          scheduleLivePreview();
        }
      });
      root.addEventListener(&#x27;click&#x27;, (event) =&gt; {
        const editEffectScope = event.target.closest(&#x27;[data-edit-effect-scope]&#x27;);
        if (editEffectScope) {
          openEffectScopeEditor(editEffectScope.closest(&#x27;[data-effect-row]&#x27;));
          return;
        }
        const editInclinationScope = event.target.closest(&#x27;[data-edit-inclination-scope]&#x27;);
        if (editInclinationScope) {
          openInclinationScopeEditor(editInclinationScope.closest(&#x27;[data-effect-row]&#x27;));
          return;
        }
        const removeEffect = event.target.closest(&#x27;[data-remove-effect]&#x27;);
        const removeSkill = event.target.closest(&#x27;[data-remove-skill]&#x27;);
        const removeHeal = event.target.closest(&#x27;[data-remove-heal]&#x27;);
        const removeInclination = event.target.closest(&#x27;[data-remove-inclination]&#x27;);
        if (removeEffect) removeEffect.closest(&#x27;[data-effect-row]&#x27;).remove();
        if (removeSkill) removeSkill.closest(&#x27;[data-skill-row]&#x27;).remove();
        if (removeHeal) removeHeal.closest(&#x27;[data-heal-row]&#x27;).remove();
        if (removeInclination) removeInclination.closest(&#x27;[data-inclination-row]&#x27;).remove();
        if (removeEffect || removeSkill || removeHeal || removeInclination) {
          updateSkillPagination();
          updateAllEffectScopeSummaries();
          updateAllInclinationScopeSummaries();
          markDirty();
          scheduleDraftSave();
        }
      });
      byId(&#x27;cdc-add-effect&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { addEffect(); markDirty(); scheduleDraftSave(); });
      root.querySelectorAll(&#x27;[data-special-effect-option]&#x27;).forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          setSpecialEffect(button.dataset.specialEffectOption);

      byId(&#x27;cdc-add-inclination-contributor&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { addInclinationContributor(); markDirty(); scheduleDraftSave(); });
      byId(&#x27;cdc-skill-prev&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { skillPage -= 1; updateSkillPagination(); });
      byId(&#x27;cdc-skill-next&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { skillPage += 1; updateSkillPagination(); });
      byId(&#x27;cdc-detail-prev&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { detailPage -= 1; renderDetailPage(); });
      byId(&#x27;cdc-detail-next&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { detailPage += 1; renderDetailPage(); });
      byId(&#x27;cdc-run-verification&#x27;).addEventListener(&#x27;click&#x27;, runVerification);
      root.querySelectorAll(&#x27;[data-calculator-type]&#x27;).forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          workspaceMode = button.dataset.calculatorType;
          calculatorType = workspaceMode === &#x27;heal&#x27; ? &#x27;heal&#x27; : &#x27;damage&#x27;;
          updateCalculatorType();

          scheduleDraftSave();

      root.querySelectorAll(&#x27;[data-verification-mode]&#x27;).forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          verificationMode = button.dataset.verificationMode;
          updateVerificationMode();
          markDirty();
          scheduleDraftSave();
        });

      byId(&#x27;cdc-save-profile&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        const key = profileKey();

          byId(&#x27;cdc-profile-status&#x27;).textContent = &#x27;请填写角色名称和版本&#x27;;

          refreshProfileSelect();

      byId(&#x27;cdc-clear-current&#x27;).addEventListener(&#x27;click&#x27;, clearCurrentConfiguration);
      byId(&#x27;cdc-open-formula&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {

      byId(&#x27;cdc-apply-formula&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; applyFormulaEditor(true));

        formulaSettings = { ...DEFAULT_FORMULA_SETTINGS };
        persistFormulaSettings();

        byId(&#x27;cdc-formula-status&#x27;).textContent = &#x27;已恢复默认公式：创生花 9000、浊燃 2700、黯星 45000、倾陷单人基础 3603、倾陷上限区 70/3、环合反应除数 600、浸染/覆纹为 20% + 最终环合强度 / 1400。&#x27;;
        markDirty();
        scheduleDraftSave();
      });
      byId(&#x27;cdc-open-ocr&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        byId(&#x27;cdc-ocr-dialog&#x27;).showModal();
        refreshCaptureWindows();
      });
      byId(&#x27;cdc-close-ocr&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; byId(&#x27;cdc-ocr-dialog&#x27;).close());
      byId(&#x27;cdc-refresh-windows&#x27;).addEventListener(&#x27;click&#x27;, refreshCaptureWindows);
      byId(&#x27;cdc-capture-panel&#x27;).addEventListener(&#x27;click&#x27;, captureCurrentPanel);
      byId(&#x27;cdc-clear-ocr&#x27;).addEventListener(&#x27;click&#x27;, clearOcrResults);
      byId(&#x27;cdc-apply-ocr&#x27;).addEventListener(&#x27;click&#x27;, applyOcrResults);
      byId(&#x27;cdc-ocr-files&#x27;).addEventListener(&#x27;change&#x27;, (event) =&gt; importOcrFiles(event.target.files));
      byId(&#x27;cdc-open-capture&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        byId(&#x27;cdc-capture-dialog&#x27;).showModal();
        discoverPacketCaptureSidecar();

      });
      byId(&#x27;cdc-close-capture&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; byId(&#x27;cdc-capture-dialog&#x27;).close());
      byId(&#x27;cdc-choose-capture-sidecar&#x27;).addEventListener(&#x27;click&#x27;, async () =&gt; {
        try {
          await choosePacketCaptureSidecar();
        } catch (error) {
          setPacketCaptureState(&#x27;idle&#x27;, error.message);
        }
      });
      byId(&#x27;cdc-start-capture&#x27;).addEventListener(&#x27;click&#x27;, startPacketCapture);
      byId(&#x27;cdc-stop-capture&#x27;).addEventListener(&#x27;click&#x27;, stopPacketCapture);
      byId(&#x27;cdc-mark-capture-action&#x27;).addEventListener(&#x27;click&#x27;, markCaptureAction);
      byId(&#x27;cdc-clear-capture-events&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        captureGroups = [];
        captureRawEvents = [];
        captureRawSelectedId = &#x27;&#x27;;
        captureCoreAudit = [];
        captureMarker = null;
        byId(&#x27;cdc-capture-marker-status&#x27;).textContent = &#x27;已清除本次事件和动作标记；已保存的事件映射不受影响。&#x27;;
        byId(&#x27;cdc-capture-diagnostics&#x27;).textContent = &#x27;&#x27;;
        renderRawEventPreview();
        renderCoreAudit();
        renderCaptureTimeline();
      });
      byId(&#x27;cdc-import-capture-normal&#x27;).addEventListener(&#x27;click&#x27;, importCapturedNormal);
      byId(&#x27;cdc-import-capture-rage&#x27;).addEventListener(&#x27;click&#x27;, importCapturedRage);
      byId(&#x27;cdc-capture-sidecar&#x27;).addEventListener(&#x27;change&#x27;, (event) =&gt; {
        if (event.target.value.trim()) localStorage.setItem(CAPTURE_SIDECAR_STORAGE_KEY, event.target.value.trim());
      });
      byId(&#x27;cdc-capture-timeline&#x27;).addEventListener(&#x27;change&#x27;, (event) =&gt; {
        if (!event.target.matches(&#x27;[data-capture-target]&#x27;)) return;
        const row = event.target.closest(&#x27;[data-capture-event]&#x27;);
        const group = captureGroups.find((item) =&gt; item.id === row?.dataset.captureEvent);
        if (group) saveCaptureTarget(group, event.target.value);
      });
      byId(&#x27;cdc-raw-event-damage&#x27;).addEventListener(&#x27;input&#x27;, () =&gt; {
        captureRawSelectedId = &#x27;&#x27;;
        renderRawEventPreview();
      });
      byId(&#x27;cdc-raw-event-character&#x27;).addEventListener(&#x27;input&#x27;, () =&gt; {
        captureRawSelectedId = &#x27;&#x27;;
        renderRawEventPreview();
        renderCoreAudit();
      });
      byId(&#x27;cdc-show-system-events&#x27;).addEventListener(&#x27;change&#x27;, renderRawEventPreview);
      byId(&#x27;cdc-core-audit-show-summary&#x27;).addEventListener(&#x27;change&#x27;, renderCoreAudit);
      byId(&#x27;cdc-clear-core-audit&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        captureCoreAudit = [];
        renderCoreAudit();
        byId(&#x27;cdc-capture-diagnostics&#x27;).textContent = &#x27;已清空审计显示；本机 NDJSON 日志仍然保留。&#x27;;
      });
      byId(&#x27;cdc-copy-core-audit&#x27;).addEventListener(&#x27;click&#x27;, async () =&gt; {
        const rows = filteredCoreAuditRecords();
        if (!rows.length) {
          byId(&#x27;cdc-capture-diagnostics&#x27;).textContent = &#x27;当前筛选条件下没有可复制的 Core 通知。&#x27;;
          return;
        }
        try {
          await navigator.clipboard.writeText(rows.map((record) =&gt; JSON.stringify(record)).join(&#x27;\n&#x27;));
          byId(&#x27;cdc-capture-diagnostics&#x27;).textContent = `已复制 ${rows.length} 条精简 Core 通知。`;
        } catch (_error) {
          byId(&#x27;cdc-capture-diagnostics&#x27;).textContent = &#x27;无法访问剪贴板；审计日志已经保存在本机 capture 文件夹。&#x27;;
        }
      });
      byId(&#x27;cdc-raw-event-target&#x27;).addEventListener(&#x27;change&#x27;, (event) =&gt; {
        const rawEvent = captureRawEvents.find((item) =&gt; item.id === captureRawSelectedId);
        const observed = Number(byId(&#x27;cdc-raw-event-damage&#x27;).value);
        if (rawEvent &amp;&amp; Number.isFinite(observed) &amp;&amp; observed &gt; 0) saveCaptureTarget(rawEventAsCaptureGroup(rawEvent, observed), event.target.value);
      });
      byId(&#x27;cdc-raw-event-preview&#x27;).addEventListener(&#x27;change&#x27;, (event) =&gt; {
        if (!event.target.matches(&#x27;[data-raw-event-selected]&#x27;)) return;
        captureRawSelectedId = event.target.dataset.rawEventSelected || &#x27;&#x27;;
        const rawEvent = captureRawEvents.find((item) =&gt; item.id === captureRawSelectedId);
        const observed = Number(byId(&#x27;cdc-raw-event-damage&#x27;).value);
        if (rawEvent &amp;&amp; Number.isFinite(observed) &amp;&amp; observed &gt; 0) {
          const group = rawEventAsCaptureGroup(rawEvent, observed);
          const suggested = mappedCaptureTarget(group) || inferredCaptureTarget(group);
          const target = byId(&#x27;cdc-raw-event-target&#x27;);
          if (Array.from(target.options).some((option) =&gt; option.value === suggested)) target.value = suggested;
        }
        renderRawEventPreview();
      });
      byId(&#x27;cdc-raw-event-preview&#x27;).addEventListener(&#x27;click&#x27;, async (event) =&gt; {
        const button = event.target.closest(&#x27;[data-copy-raw-event]&#x27;);
        if (!button) return;
        try {
          await navigator.clipboard.writeText(button.dataset.copyRawEvent || &#x27;&#x27;);
          byId(&#x27;cdc-capture-diagnostics&#x27;).textContent = `已复制事件名称：${button.dataset.copyRawEvent}`;
        } catch (_error) {
          byId(&#x27;cdc-capture-diagnostics&#x27;).textContent = &#x27;无法访问剪贴板；请手动选择事件名称。&#x27;;
        }
      });
      byId(&#x27;cdc-close-effect-scope&#x27;).addEventListener(&#x27;click&#x27;, closeEffectScopeEditor);
      byId(&#x27;cdc-cancel-effect-scope&#x27;).addEventListener(&#x27;click&#x27;, closeEffectScopeEditor);
      byId(&#x27;cdc-apply-effect-scope&#x27;).addEventListener(&#x27;click&#x27;, applyEffectScopeEditor);
      byId(&#x27;cdc-effect-scope-mode&#x27;).addEventListener(&#x27;change&#x27;, (event) =&gt; {
        byId(&#x27;cdc-effect-scope-skills&#x27;).hidden = event.target.value !== &#x27;custom&#x27;;
      });
      byId(&#x27;cdc-effect-scope-dialog&#x27;).addEventListener(&#x27;close&#x27;, () =&gt; { editingEffectScopeRow = null; });
      byId(&#x27;cdc-close-inclination-scope&#x27;).addEventListener(&#x27;click&#x27;, closeInclinationScopeEditor);
      byId(&#x27;cdc-cancel-inclination-scope&#x27;).addEventListener(&#x27;click&#x27;, closeInclinationScopeEditor);
      byId(&#x27;cdc-apply-inclination-scope&#x27;).addEventListener(&#x27;click&#x27;, applyInclinationScopeEditor);
      byId(&#x27;cdc-inclination-scope-mode&#x27;).addEventListener(&#x27;change&#x27;, (event) =&gt; {
        byId(&#x27;cdc-inclination-scope-contributors&#x27;).hidden = event.target.value !== &#x27;custom&#x27;;
      });
      byId(&#x27;cdc-inclination-scope-dialog&#x27;).addEventListener(&#x27;close&#x27;, () =&gt; { editingInclinationScopeRow = null; });

      syncFormulaEditor();
      refreshProfileSelect();
      updateCalculatorType();
      let restoredDraft = false;
      try {
        const draft = JSON.parse(localStorage.getItem(DRAFT_STORAGE_KEY) || &#x27;null&#x27;);
        if (draft) restoredDraft = applyData(draft);
      } catch (_error) {
        restoredDraft = false;
      }
      if (!restoredDraft) {
        addEffect(&#x27;觉醒A&#x27;, { damage: 20 });
        addEffect(&#x27;武器B&#x27;, { attack: 20 });
        addSkill(&#x27;技能一&#x27;, &#x27;skill&#x27;, 240, 4413, false);
        addSkill(&#x27;技能二&#x27;, &#x27;skill&#x27;, 315, 5793, false, true, &#x27;dot&#x27;);
        addHeal(&#x27;治疗一&#x27;, 120, 2520);
        updateSkillPagination();
        updateCalculatorType();
        markDirty();
        scheduleDraftSave();
      }
    })();
  &lt;/script&gt;
&lt;/div&gt;
&lt;/body&gt;
&lt;/html&gt;
"></iframe>
<script data-cdc-desktop-bridge>
(() => {
  const frame = document.querySelector('iframe');
  const allowed = new Set(['get_capture_windows', 'capture_panel', 'recognize_uploaded_image']);
  let ready = Boolean(window.pywebview && window.pywebview.api);

  function notifyReady() {
    if (frame && frame.contentWindow) frame.contentWindow.postMessage({ type: 'cdc-api-ready' }, '*');
  }

  window.addEventListener('pywebviewready', () => {
    ready = true;
    notifyReady();
  });

  window.addEventListener('message', async (event) => {
    if (!frame || event.source !== frame.contentWindow) return;
    const message = event.data || {};
    if (message.type === 'cdc-api-probe') {
      if (ready || (window.pywebview && window.pywebview.api)) {
        ready = true;
        notifyReady();
      }
      return;
    }
    if (message.type !== 'cdc-api-call' || !message.id) return;
    if (!allowed.has(message.method)) {
      frame.contentWindow.postMessage({ type: 'cdc-api-result', id: message.id, ok: false, error: '不允许的桌面功能。' }, '*');
      return;
    }
    try {
      if (!window.pywebview || !window.pywebview.api) throw new Error('桌面功能尚未就绪。');
      const result = await window.pywebview.api[message.method](...(message.args || []));
      frame.contentWindow.postMessage({ type: 'cdc-api-result', id: message.id, ok: true, result }, '*');
    } catch (error) {
      frame.contentWindow.postMessage({
        type: 'cdc-api-result', id: message.id, ok: false,
        error: error && error.message ? error.message : String(error)
      }, '*');
    }
  });

  if (ready) notifyReady();
})();
</script>
